ROSTemplateFormatVersion: '2015-09-01'
Description:
  en: Create ack Cluster And JumpBox Ecs, Deploy with kubectl -f yaml with new vpc
  zh-cn: 创建/选择ack集群和跳板机并使用kubectl部署(新建vpc)
Conditions:
  IsPublicEnabled:
    Fn::Equals:
      - Ref: SupportPublicAccess
      - true
  IsVLModel:
    Fn::Or:
      - Fn::Equals:
          - 'Qwen/Qwen2.5-VL-72B-Instruct'
          - Ref: ModelName
      - Fn::Equals:
          - 'Qwen/Qwen2.5-VL-32B-Instruct'
          - Ref: ModelName
      - Fn::Equals:
          - 'Qwen/Qwen2.5-VL-7B-Instruct'
          - Ref: ModelName
  IfPPU:
    Fn::Or:
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen2.5-7B-Instruct_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen2.5-32B-Instruct_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen2.5-72B-Instruct_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen2.5-VL-7B-Instruct_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen2.5-VL-32B-Instruct_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen2.5-VL-72B-Instruct_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen3-8B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen3-14B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen3-30B-A3B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen3-32B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'Qwen3-235B-A22B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-R1_671B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-R1-0528-Qwen3-8B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-R1-0528_671B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-R1-Distill-Qwen-7B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-R1_32B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-R1_70B_PPU'
      - Fn::Equals:
          - Ref: GPUType
          - 'DeepSeek-V3_PPU'
  CreateNewOSS:
    Fn::Equals:
      - Ref: CreateOSS
      - true
Parameters:
  CreateOSS:
    Type: Boolean
    Label:
      en: Create New OSS Bucket
      zh-cn: 新建OSS Bucket
    Description:
      en: Whether to create a new OSS bucket or use an existing one
      zh-cn: 是否新建OSS存储桶或使用已有的
    Default: true
  ExistingOSSBucket:
    Type: String
    Label:
      en: Existing OSS Bucket Name
      zh-cn: 已有OSS存储桶名称
    Description:
      en: Name of the existing OSS bucket (required when not creating new OSS)
      zh-cn: 已有OSS存储桶的名称（不新建OSS时必填）
    Default: ""
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ${CreateOSS}
            - false
  ClusterId:
    Type: String
    Description:
      en: The ID of Kubernetes ClusterId in which application deployed.
      zh-cn: 部署应用程序的K8s集群ID
    AllowedPattern: '[0-9a-z]+$'
    Default: null
    Required: true
    Label:
      en: Kubernetes ClusterId
      zh-cn: K8s集群ID
    AssociationProperty: 'ALIYUN::CS::Cluster::ClusterId'
    AssociationPropertyMetadata:
      RegionId: '${RegionId}'
      Visible:
        Condition:
          Fn::Equals:
            - ${CreateAck}
            - false
  EngineType:
    Type: String
    Label:
      en: Engine Type
      zh-cn: 部署方式
    Default: "vLLM"
    AllowedValues:
      - vLLM
      - SGLang
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      ForceRadio: true
      AllowedValues:
        - Condition:
            Fn::And:
              - Fn::Equals:
                  - 'DeepSeek-R1-0528-Qwen3-8B_PPU'
                  - ${GPUType}
              - Fn::Equals:
                  - 'DeepSeek-R1-0528_671B_PPU'
                  - ${GPUType}
              - Fn::Equals:
                  - 'DeepSeek-V3_PPU'
                  - ${GPUType}
          Value:
            - vLLM
        - Condition:
            Fn::Not:
              Fn::And:
                - Fn::Equals:
                    - 'DeepSeek-R1-0528-Qwen3-8B_PPU'
                    - ${GPUType}
                - Fn::Equals:
                    - 'DeepSeek-R1-0528_671B_PPU'
                    - ${GPUType}
                - Fn::Equals:
                    - 'DeepSeek-V3_PPU'
                    - ${GPUType}
          Value:
            - vLLM
            - SGLang
  ModelType:
    Type: String
    Label:
      en: ModelName Type
      zh-cn: 模型系列
    Default: "Qwen3"
    AllowedValues:
      - Qwen3
      - Qwen2.5
      - Qwen-VL
      - QwQ
      - Deepseek
