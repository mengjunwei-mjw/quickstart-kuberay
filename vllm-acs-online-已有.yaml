        en: |
          <strong>Important Preconditions:</strong>
          Before using this service, please ensure that the whitelist rule for P16EN/GU8TF/L20 instances is correctly configured. Contact customer service, sales, or submit a ticket to add the whitelist.
          <a href="https://smartservice.console.aliyun.com/service/create-ticket" target="_blank">Submit a ticket</a>
      ConfirmText:
        zh-cn: "我已确认完成白名单配置"
        en: "I have confirmed the whitelist configuration"
      Alert: true
      Type: "warning"
      MustChecked: true
  SupportPublicAccess:
    Type: Boolean
    Label:
      zh-cn: 支持公网访问
      en: Support Public Access
  Replicas:
    Type: Number
    Label:
      en: Replicas
      zh-cn: Pod数量
    MinValue: 1
    Default: 1
    Description:
      en: The number of replicas, the load balancer will automatically distribute requests to one pod
      zh-cn: 创建的pod数量，负载均衡会根据流量自动分配请求到某一个pod
Resources:
  KubernetesCluster:
    Type: DATASOURCE::CS::KubernetesCluster
    Properties:
      ClusterId:
        Ref: ClusterId
  ClusterUserKubeconfig:
    Type: DATASOURCE::CS::ClusterUserKubeconfig
    Properties:
      ClusterId:
        Ref: ClusterId
      # 可选参数
      PrivateIpAddress: true  # 是否获取内网访问凭证（默认公网）
  RandomPassword:
    Type: ALIYUN::RandomString
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="
  OSSBucket:
    Type: 'ALIYUN::OSS::Bucket'
    Condition: CreateNewOSS
    Properties:
      DeletionForce: true
      BucketName:
        Ref: ALIYUN::StackName
  OSSRamUser:
    DependsOn: OSSBucket
    Type: ALIYUN::RAM::User
    Properties:
      UserName:
        Ref: ALIYUN::StackName
      Policies:
        - PolicyName:
            Ref: ALIYUN::StackName
          PolicyDocument:
            Statement:
              - Action:
                  - oss:*
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateNewOSS
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: ExistingOSSBucket
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateNewOSS
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: ExistingOSSBucket
            Version: '1'
  AccessKey:
    DependsOn: OSSRamUser
    Type: ALIYUN::RAM::AccessKey
    Properties:
      UserName:
        Ref: ALIYUN::StackName
  ClusterApplication:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - AccessKey
    Properties:
      YamlContent:
        Fn::Sub:
          - |
            apiVersion: v1
            kind: Secret
            metadata:
              name: oss-secret
              namespace: llm-model
            stringData:
              akId: ${AccessKeyId}
              akSecret: ${AccessKeySecret}
          - AccessKeyId:
              Fn::GetAtt:
                - AccessKey
                - AccessKeyId
            AccessKeySecret:
              Fn::GetAtt:
                - AccessKey
                - AccessKeySecret
      ClusterId:
        Ref: ClusterId
      DefaultNamespace: llm-model
  EcsInstanceJumpBox:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      InstanceName:
        Fn::Join:
          - '-'
          - - Ref: ALIYUN::StackName
            - jumpbox
      ImageId:
        Fn::FindInMap:
          - ModelMapping
          - ModelImageMap
          - Ref: GPUType
      InstanceType: 'ecs.u1-c1m2.xlarge'
      ZoneId:
        Fn::GetAtt:
          - KubernetesCluster
          - ZoneId
      VpcId:
        Fn::GetAtt:
          - KubernetesCluster
          - VpcId
      VSwitchId:
        Fn::GetAtt:
          - KubernetesCluster
          - VSwitchId
      SecurityGroupId:
        Fn::GetAtt:
          - KubernetesCluster
          - SecurityGroupId
      AllocatePublicIP: false
      Password:
        Ref: RandomPassword
      MaxAmount: 1
      InstanceChargeType: PostPaid
      SystemDiskSize:
        Fn::FindInMap:
          - ModelMapping
          - ModelDiskSizeMap
          - Ref: GPUType
      SystemDiskCategory: cloud_essd
  RunAllCommands:
    Type: ALIYUN::ECS::RunCommand
    DependsOn:
      - EcsInstanceJumpBox
      - RandomApiKey
      - ClusterApplication
    Properties:
      Sync: true
      Type: RunShellScript
      InstanceIds:
        - Fn::Select:
            - 0
            - Fn::GetAtt:
                - EcsInstanceJumpBox
                - InstanceIds
      Timeout: '86400'  # 延长超时时间
      CommandContent:
        Fn::Sub:
          - |
            #!/bin/bash
            # 设置日志输出：普通日志记录到文件，错误信息同时输出到终端和文件
            exec > >(cat >>/tmp/deploy.log) 2> >(tee -a /tmp/deploy.log >&2)
            set -e  # 遇到错误立即终止
            
            # --- 1. 安装基础工具 ---
            echo "Checking kubectl installation..."
            if ! command -v kubectl &> /dev/null; then
              echo "Installing kubectl..."
              wget "{{ computenest::file::kubectl }}" -O kubectl >> /tmp/deploy.log 2>&1
              install -o root -g root -m 0755 kubectl /usr/bin/kubectl >> /tmp/deploy.log 2>&1
              chmod +x /usr/bin/kubectl
              echo "Configuring kubectl..."
              mkdir -p ~/.kube
              echo '${kubeConfig}' >> ~/.kube/config
              sleep 10
            else
              echo "kubectl already installed."
            fi
            
            # --- 2. 安装模板渲染工具 ---
            echo "Installing jinja2-render..."
            if ! command -v jinja2-render &> /dev/null; then
              echo "Downloading jinja2-render wheel package..."
              wget "{{ computenest::file::jinja2 }}" -O jinja2_renderer-0.1.0-py3-none-any.whl >> /tmp/deploy.log 2>&1
            
              echo "Installing jinja2-render from wheel..."
              pip3 install jinja2_renderer-0.1.0-py3-none-any.whl >> /tmp/deploy.log 2>&1
              cp /usr/local/bin/jinja2-render /usr/bin/
            
              # 清理下载的文件
              rm -f jinja2_renderer-0.1.0-py3-none-any.whl
            
              # 验证安装
              if command -v jinja2-render &> /dev/null; then
                echo "jinja2-render installed successfully."
              else
                echo "Failed to install jinja2-render" >&2
                exit 1
              fi
            else
              echo "jinja2-render already installed."
            fi
            
            # --- 3. 配置 OSS 和上传模型 ---
            echo "Checking ossutil installation..."
            if ! command -v ossutil &> /dev/null; then
              echo "Configuring OSS..."
              sudo -v >> /tmp/deploy.log 2>&1
            
              # 安装ossutil2.0
              wget "{{ computenest::file::ossutil }}" -O ossutil.zip >> /tmp/deploy.log 2>&1
              unzip ossutil.zip >> /tmp/deploy.log 2>&1
              cd ossutil-2.1.0-linux-amd64
              chmod 755 ossutil >> /tmp/deploy.log 2>&1
              mv -f ossutil /usr/local/bin/ && sudo ln -sf /usr/local/bin/ossutil /usr/bin/ossutil >> /tmp/deploy.log 2>&1
              ossutil >> /tmp/deploy.log 2>&1
            else
              echo "ossutil already installed."
            fi
            cd ..
            cat >> /usr/bin/oss.cfg <<EOF
            [Credentials]
            endpoint = oss-${regionId}-internal.aliyuncs.com
            accessKeyID = ${accessKeyId}
            accessKeySecret = ${accessKeySecret}
            region = ${regionId}
            EOF
            
            sysctl -w net.ipv4.tcp_window_scaling=1
            sysctl -w net.core.rmem_max=16777216
            sysctl -w net.core.wmem_max=16777216
            
            # 如果model是DeepSeek-R1_671B_PPU，替换config.json中的 quantization_config
            if [ "${model}" == "DeepSeek-R1_671B_PPU" ] || [ "${model}" == "DeepSeek-R1-0528_671B_PPU" ] || [ "${model}" == "DeepSeek-V3_PPU" ]; then
              echo "Replacing quantization_config in config.json..."
              CONFIG_FILE="/root/llm-model/${modelName}/config.json"
              cp "$CONFIG_FILE" "$CONFIG_FILE.bak"
              jq '.quantization_config = {
                  "bits": 8,
                  "group_size": 128,
                  "desc_act": false,
                  "quant_method": "gptq-fp8",
                  "sym": true
              }' "$CONFIG_FILE" > "$CONFIG_FILE.tmp"
            
              # 替换原文件
              mv -f "$CONFIG_FILE.tmp" "$CONFIG_FILE"
            fi
            ossutil --config-file /usr/bin/oss.cfg cp -r /root/llm-model/${modelName} oss://${bucketName}/llm-model/${modelName} --ignore-existing | tee download.log
            
            # --- 4. 获取Jinja2模板文件 ---
            echo "Getting Jinja2 template file..."
            wget "{{ computenest::file::template-j2 }}" -O template.j2 >> /tmp/deploy.log 2>&1
            if [ ! -f "template.j2" ]; then
              echo "Error: template.j2 file not found"
              exit 1
            fi
            
            # --- 5. 参数计算 ---
            echo "Creating parameter generation script..."
            # 判断GPU类型
            gpu_type_is_ppu="false"
            if [[ "${model}" == *"PPU"* ]]; then
                gpu_type_is_ppu="true"
            fi
            
            # 判断是否为DeepSeek FP8 PPU模型
            is_deepseek_fp8_ppu_model="false"
            if [[ "${model}" == "DeepSeek-R1-0528_671B_PPU" ]] || [[ "${model}" == "DeepSeek-R1-0528-Qwen3-8B_PPU" ]] || [[ "${model}" == "DeepSeek-V3_PPU" ]]; then
                is_deepseek_fp8_ppu_model="true"
            fi
            
            # 确定GPU模型系列
            gpu_model_series="H20"
            if [[ "${model}" == *"H20-3e"* ]]; then
                gpu_model_series="H20-3e"
            elif [[ "${model}" == *"PPU"* ]]; then
                gpu_model_series="PPU810E"
            elif [[ "${model}" == *"L20"* ]]; then
                gpu_model_series="L20"
            fi
            
            # 判断是否为VL模型
            is_vl_model="false"
            if [[ "${modelName}" == *"VL"* ]]; then
                is_vl_model="true"
            fi
            
            # 判断是否为FP8模型
            is_fp8_model="false"
            if [[ "${modelName}" == *"FP8"* ]] || [[ "${model}" == *"FP8"* ]]; then
                is_fp8_model="true"
            fi
            
            # 判断是否为vLLM引擎
            is_vllm_engine="false"
            if [[ "${engineType}" == "vLLM" ]]; then
                is_vllm_engine="true"
            fi
            
            # 判断是否为SGLang引擎
            is_sglang_engine="false"
            if [[ "${engineType}" == "SGLang" ]]; then
                is_sglang_engine="true"
            fi
            
            # 写入parameters.yaml
            cat > parameters.yaml << EOF
            gpu_type_is_ppu: $gpu_type_is_ppu
            gpu_model_series: "$gpu_model_series"
            is_vl_model: $is_vl_model
            is_fp8_model: $is_fp8_model
            is_deepseek_fp8_ppu_model: $is_deepseek_fp8_ppu_model
            is_vllm_engine: $is_vllm_engine
            is_sglang_engine: $is_sglang_engine
            support_public_access: ${supportPublicAccess}
            EOF
            
            echo "参数已写入 parameters.yaml"
            
            # 渲染模板
            if [[ -f "template.j2" ]]; then
                jinja2-render template.j2 -c parameters.yaml -o model.yaml
                echo "模板已渲染到 model.yaml"
            else
                echo "错误: template.j2 文件不存在"
                exit 1
            fi
            
            # --- 6. 替换模板中的变量并部署模型 ---
            echo "Deploying model..."
            DEPLOYMENT=${deploymentName}
            
            # 替换模板中的变量
            sed -i "s|\${!ModelName}|${modelName}|g" model.yaml
            sed -i "s|\${!DeploymentName}|${deploymentName}|g" model.yaml
            sed -i "s|\${!VllmApiKey}|${vllmApiKey}|g" model.yaml
            sed -i "s|\${!RegionId}|${regionId}|g" model.yaml
            sed -i "s|\${!GPUAmount}|${gpuAmount}|g" model.yaml
            sed -i "s|\${!BucketName}|${bucketName}|g" model.yaml
            sed -i "s|\${!AccessKeyId}|${accessKeyId}|g" model.yaml
            sed -i "s|\${!AccessKeySecret}|${accessKeySecret}|g" model.yaml
            sed -i "s|\${!Label}|${label}|g" model.yaml
            sed -i "s|\${!Replicas}|${replicas}|g" model.yaml
            
            # 设置PPU对应的CPU和Memory
            if [[ "${model}" == *"PPU"* ]]; then
                echo "检测到PPU型号，根据GPU数量配置资源..."
                sed -i "s|\${!CPUAmount}|${cpuAmount}|g" model.yaml
                sed -i "s|\${!Memory}|${memory}Gi|g" model.yaml
                echo "PPU资源配置完成: CPU=${cpuAmount}核, 内存=${memory}GB"
            fi
            
            cat model.yaml && kubectl apply -f model.yaml --validate=false
            echo "Monitoring deployment: $DEPLOYMENT"
            NAMESPACE="llm-model"
            MAX_ATTEMPTS=300
            INTERVAL=20
            SUCCESS=false
            for ((i=1; i<=MAX_ATTEMPTS; i++)); do
              POD=$(kubectl get pods -n "$NAMESPACE" -l app="$DEPLOYMENT" -o jsonpath='{.items[0].metadata.name}')
              if [ -z "$POD" ]; then
                  echo "Waiting for pod creation... ($i/$MAX_ATTEMPTS)"
              else
                  CONTAINER_INSTANCE_STATUS=$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="ContainerInstanceCreated")].status}' 2>/dev/null)
                  CONTAINER_INSTANCE_REASON=$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="ContainerInstanceCreated")].reason}' 2>/dev/null)
            
                  if [[ "$CONTAINER_INSTANCE_STATUS" == "False" ]]; then
                    if [[ "$CONTAINER_INSTANCE_REASON" == *"FailedScheduling"* ]]; then
                      echo "Error: ContainerInstanceCreated failed due to scheduling failure!"
                      echo "Pod $POD is in phase: $PHASE (Attempt $i/$MAX_ATTEMPTS)"
                      echo "Exiting due to scheduling error."
                      SUCCESS=false
                      break
                    elif [[ "$CONTAINER_INSTANCE_REASON" == "FeatureGetNoPermission" ]]; then
                      echo "Error: ContainerInstanceCreated failed due to permission issue: FeatureGetNoPermission"
                      echo "Pod $POD is in phase: $PHASE (Attempt $i/$MAX_ATTEMPTS)"
                      echo "请检查 GPU 资源访问权限：PPU/H20/H20-3e/L20 实例是否已正确配置白名单？"
                      echo "Exiting due to permission error."
                      SUCCESS=false
                      break
                    fi
                  fi
            
                  READY=$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.containerStatuses[0].ready}')
                  PHASE=$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}')
                  if [[ "$READY" == "true" && "$PHASE" == "Running" ]]; then
                      echo "Pod $POD is ready!"
                      SUCCESS=true
                      break
                  else
                      echo "Pod $POD status: $PHASE (Attempt $i/$MAX_ATTEMPTS)"
                  fi
              fi
              sleep $INTERVAL
            done
            
              # 处理结果
            if [ "$SUCCESS" = "true" ]; then
                echo "Deployment succeeded"
            else
                echo "GPU库存不足，Pod拉起失败" >&2
                echo "Pod 状态信息：" >&2
                kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{range .status.containerStatuses[*]}Container: {.name} | Ready: {.ready} | State: {.state}{"\n"}{end}' >&2 || true                                                                                       
                echo "最近事件：" >&2
                kubectl get events --field-selector involvedObject.name="$POD" -n "$NAMESPACE" --sort-by='.lastTimestamp' -o jsonpath='{range .items[*]}{.lastTimestamp} {.reason} {.message}{"\n"}{end}' >&2 || true
                exit 1
            fi
            
            # --- 7. 检测Private Service是否正常（最大15min）---
            # 新增：获取 Private Service 的 LoadBalancer IP
            MAX_ATTEMPTS=90
            INTERVAL=10
            SERVICE_NAME="svc-private"
            PRIVATE_IP=""
            for ((i=1; i<=MAX_ATTEMPTS; i++)); do
              PRIVATE_IP=$(kubectl get service "$SERVICE_NAME" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [[ -n "$PRIVATE_IP" && "$PRIVATE_IP" != "<pending>" ]]; then
                echo "Private Service IP: $PRIVATE_IP" >&2
                break
              else
                echo "Waiting for IP... (Attempt $i/$MAX_ATTEMPTS)" >&2
                sleep $INTERVAL
              fi
            done
              if [[ -z "$PRIVATE_IP" || "$PRIVATE_IP" == "<pending>" ]]; then
                echo "Failed to get Private Service IP after $MAX_ATTEMPTS attempts" >&2
                exit 1
              fi
            
              # --- 8. 检测发送响应消息是否正常（最大10min）---
              set +e
              echo "Testing Private Service connectivity..."
              MAX_ATTEMPTS=20
              INTERVAL=30
              SUCCESS=false
              for ((i=1; i<=MAX_ATTEMPTS; i++)); do
                # 发送请求并捕获响应
                RESPONSE=$(curl --max-time 10 -s -w "%{http_code}" \
                  -X POST "http://$PRIVATE_IP:8000/v1/chat/completions" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${vllmApiKey}" \
                  -d '{"model": "${modelName}", "messages": [{"role": "user", "content": "你是什么？"}], "max_tokens": 1, "temperature": 0, "top_p": 0.9, "seed": 10, "stream": true}' \
                  2>>/tmp/deploy.log)
              # 检查 curl 是否失败
              curl_exit_code=$?
              echo "curl 退出码: $curl_exit_code" >&2
            
              if [ $curl_exit_code -ne 0 ]; then
                echo "curl 命令失败，退出码 $curl_exit_code，重试..." >&2
                sleep $INTERVAL
                continue
              fi
              HTTP_CODE=${!RESPONSE: -3}  # 提取 HTTP 状态码
              RESPONSE_BODY=${!RESPONSE%???}  # 提取响应体
            
            
              if [[ "$HTTP_CODE" == "200" && -n "$RESPONSE_BODY" ]]; then
                echo "响应内容：$RESPONSE_BODY" >&2
                SUCCESS=true
                break
              else
                echo "尝试 $i/$MAX_ATTEMPTS 失败 (HTTP 状态码: $HTTP_CODE)" >&2
              fi
              if [[ $i -lt $MAX_ATTEMPTS ]]; then
                sleep $INTERVAL
              fi
            done
            
            set -e
            if [ "$SUCCESS" != "true" ]; then
              echo "集群网络问题" >&2
              exit 1
            fi
          - kubeConfig:
              Fn::GetAtt:
                - ClusterUserKubeconfig
                - Config
            accessKeyId:
              Fn::GetAtt:
                - AccessKey
                - AccessKeyId
            accessKeySecret:
              Fn::GetAtt:
                - AccessKey
                - AccessKeySecret
            regionId:
              Ref: ALIYUN::Region
            bucketName:
              Fn::If:
                - CreateNewOSS
                - Fn::GetAtt:
                    - OSSBucket
                    - Name
                - Ref: ExistingOSSBucket
            model:
              Ref: GPUType
            engineType:
              Ref: EngineType
            modelName:
              Fn::FindInMap:
                - ModelMapping
                - ModelNameMap
                - Ref: GPUType
            deploymentName:
              Fn::FindInMap:
                - ModelMapping
                - DeploymentName
                - Ref: GPUType
            vllmApiKey:
              Fn::Join:
                - '-'
                - - 'sk'
                  - Fn::GetAtt:
                      - RandomApiKey
                      - value
            label:
              Fn::FindInMap:
                - ModelMapping
                - DeploymentName
                - Ref: GPUType
            supportPublicAccess:
              Ref: SupportPublicAccess
            gpuAmount:
              Ref: GPUAmount
            cpuAmount:
              Fn::FindInMap:
                - ModelMapping
                - PPU810E_CPUMap
                - Ref: GPUAmount
            memory:
              Fn::FindInMap:
                - ModelMapping
                - PPU810E_MemoryMap
                - Ref: GPUAmount
            replicas:
              Ref: Replicas
  RandomApiKey:
    Type: ALIYUN::RandomString
    Properties:
      length: 29
      character_classes:
        - class: lowercase
          min: 1
        - class: digits
          min: 1
  PrivateIngressResources:
    Type: DATASOURCE::CS::ClusterApplicationResources
    DependsOn:
      - RunAllCommands
    Properties:
      Namespace: llm-model
      Kind: Service
      FirstMatch: True
      ApiVersion: v1
      JsonPath: $.status.loadBalancer.ingress[0].ip
      ClusterId:
        Ref: ClusterId
      Name: svc-private
  PublicIngressResources:
    Type: DATASOURCE::CS::ClusterApplicationResources
    DependsOn:
      - RunAllCommands
    Condition: IsPublicEnabled
    Properties:
      Namespace: llm-model
      Kind: Service
      FirstMatch: True
      ApiVersion: v1
      JsonPath: $.status.loadBalancer.ingress[0].ip
      ClusterId:
        Ref: ClusterId
      Name: svc-public
Mappings:
  ModelMapping:
    ModelImageMap:
      'QwQ-32B_H20': 'm-qwq-32b-h20'
      'Qwen3-32B_H20': 'm-qwen3-32b'
      'Qwen3-32B_PPU': 'm-qwen3-32b'
      'Qwen3-235B-A22B_H20': 'm-qwen3-235b-a22b'
      'Qwen3-235B-A22B_PPU': 'm-qwen3-235b-a22b'
      'Qwen3-235B-A22B-FP8_H20': 'm-qwen3-235b-a22b-fp8'
      'Qwen2.5-7B-Instruct_PPU': 'm-qwen2_5-7b-instruct'
      'Qwen2.5-32B-Instruct_PPU': 'm-qwen2_5-32b-instruct'
      'Qwen2.5-72B-Instruct_PPU': 'm-qwen2_5-72b-instruct'
      'Qwen2.5-VL-7B-Instruct_PPU': 'm-qwen-vl-7b-instruct'
      'Qwen2.5-VL-32B-Instruct_PPU': 'm-qwen-vl-32b-instruct'
      'Qwen2.5-VL-72B-Instruct_PPU': 'm-qwen-vl-72b-instruct'
      'DeepSeek-R1_671B_H20': 'm-deepseek-r1-671b'
      'DeepSeek-R1_671B_H20-3e': 'm-deepseek-r1-671b'
      'DeepSeek-R1_671B_PPU': 'm-deepseek-r1-671b'
      'DeepSeek-R1-0528_671B_H20': 'm-DeepSeek-R1-0528'
      'DeepSeek-R1-0528_671B_H20-3e': 'm-DeepSeek-R1-0528'
      'DeepSeek-R1-0528_671B_PPU': 'm-DeepSeek-R1-0528'
      'DeepSeek-R1_32B_H20': 'm-DeepSeek-R1-Distill-Qwen-32B'
      'DeepSeek-R1_32B_H20-3e': 'm-DeepSeek-R1-Distill-Qwen-32B'
      'DeepSeek-R1_32B_PPU': 'm-DeepSeek-R1-Distill-Qwen-32B'
      'DeepSeek-R1_70B_H20': 'm-DeepSeek-R1-Distill-Llama-70B'
      'DeepSeek-R1_70B_H20-3e': 'm-DeepSeek-R1-Distill-Llama-70B'
      'DeepSeek-R1_70B_PPU': 'm-DeepSeek-R1-Distill-Llama-70B'
      'Qwen3-8B_PPU': 'm-qwen3-8b'
      'Qwen3-14B_PPU': 'm-qwen3-14b'
