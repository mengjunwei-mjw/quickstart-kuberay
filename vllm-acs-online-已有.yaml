Outputs:
  InstancePassword:
    NoEcho: 'True'
    Label:
      en: Ecs Instance password
      zh-cn: ECS实例密码
    Description:
      en: Initial instance password
      zh-cn: ECS实例密码
    Value:
      Fn::GetAtt:
        - RandomPassword
        - value
  ApiKey:
    NoEcho: true
    Label: "API Key"
    Value:
      Fn::Join:
        - '-'
        - - 'sk'
          - Fn::GetAtt:
              - RandomApiKey
              - value
  内网地址:
    Label: 内网地址
    Value:
      Fn::Sub:
        - 'http://${PrivateIp}:8000/v1/'
        - PrivateIp:
            Fn::GetAtt:
              - PrivateIngressResources
              - Response
  公网地址:
    Label: 公网地址
    Condition: IsPublicEnabled
    Value:
      Fn::Sub:
        - 'http://${PublicIp}:8000/v1/'
        - PublicIp:
            Fn::GetAtt:
              - PublicIngressResources
              - Response
  Api调用示例:
    Label: Api调用示例
    Description: 通过以下命令发送HTTP请求即可访问推理服务，内网访问需保证在同一VPC下。
    Value:
      Fn::If:
        - IsVLModel
        - Fn::Sub:
            - 'curl -X POST "http://${IP}:8000/v1/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer ${VllmApiKey}" --data ''{ "stream": true, "model": "${ModelName}", "messages": [ { "role": "system", "content": "You are a helpful assistant." }, { "role": "user", "content": [ { "type": "image_url", "image_url": { "url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png" } }, { "type": "text", "text": "What is the text in the illustrate?" } ] } ] }'''
            - IP:
                Fn::If:
                  - IsPublicEnabled
                  - Fn::GetAtt:
                      - PublicIngressResources
                      - Response
                  - Fn::GetAtt:
                      - PrivateIngressResources
                      - Response
              VllmApiKey:
                Fn::Join:
                  - '-'
                  - - 'sk'
                    - Fn::GetAtt:
                        - RandomApiKey
                        - value
        - Fn::Sub:
            - 'curl -X POST "http://${IP}:8000/v1/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer ${VllmApiKey}" --data ''{ "model": "${ModelName}", "stream": true, "messages": [ { "role": "user", "content": "Tell me the recipe for tea" } ] }'''
            - IP:
                Fn::If:
                  - IsPublicEnabled
                  - Fn::GetAtt:
                      - PublicIngressResources
                      - Response
                  - Fn::GetAtt:
                      - PrivateIngressResources
                      - Response
              VllmApiKey:
                Fn::Join:
                  - '-'
                  - - 'sk'
                    - Fn::GetAtt:
                        - RandomApiKey
                        - value
  模型名称:
    Label:
      zh-ch: 模型名称
      en: Model Name
    Value:
      Fn::FindInMap:
        - ModelMapping
        - ModelNameMap
        - Ref: GPUType
  在线访问:
    Label:
      zh-ch: 在线访问
      en: Online Visit
    Value: '<a href="https://appflow.console.aliyun.com/vendor/cn-hangzhou/llm/chat?serviceInstanceId={{serviceInstanceId}}"> 访问链接 </a>'
Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - WhitelistConfirmation
        Label:
          en: Whitelist Confirmation
          zh-cn: 白名单确认
      - Parameters:
          - ClusterId
          - CreateOSS
          - ExistingOSSBucket
        Label:
          en: Basic Configuration
          zh-cn: 基础资源配置
      - Parameters:
          - ModelType
          - ModelName
          - GPUType
          - GPUAmount
          - Replicas
          - SupportPublicAccess
        Label:
          en: Model Config
          zh-cn: 模型配置