                      imagePullPolicy: IfNotPresent
                      lifecycle:
                        preStop:
                          exec:
                            command:
                              - /wait-shutdown
                      args:
                        - /nginx-ingress-controller
                        - --election-id=ingress-controller-leader-nginx
                        - --ingress-class=nginx
                        - --watch-ingress-without-class
                        - --controller-class=k8s.io/ingress-nginx
                        - --configmap=$(POD_NAMESPACE)/nginx-configuration
                        - --tcp-services-configmap=$(POD_NAMESPACE)/tcp-services
                        - --udp-services-configmap=$(POD_NAMESPACE)/udp-services
                        - --annotations-prefix=nginx.ingress.kubernetes.io
                        - --publish-service=$(POD_NAMESPACE)/nginx-ingress-lb
                        - --enable-annotation-validation
                        - --shutdown-grace-period=30
                        - --v=2
                      securityContext:
                        capabilities:
                          drop:
                            - ALL
                          add:
                            - NET_BIND_SERVICE
                        runAsUser: 101
                        allowPrivilegeEscalation: true
                      env:
                        - name: POD_NAME
                          valueFrom:
                            fieldRef:
                              fieldPath: metadata.name
                        - name: POD_NAMESPACE
                          valueFrom:
                            fieldRef:
                              fieldPath: metadata.namespace
                        - name: LD_PRELOAD
                          value: /usr/local/lib/libmimalloc.so
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: 10254
                          scheme: HTTP
                        initialDelaySeconds: 10
                        periodSeconds: 10
                        timeoutSeconds: 1
                        successThreshold: 1
                        failureThreshold: 5
                      readinessProbe:
                        httpGet:
                          path: /healthz
                          port: 10254
                          scheme: HTTP
                        initialDelaySeconds: 10
                        periodSeconds: 10
                        timeoutSeconds: 1
                        successThreshold: 1
                        failureThreshold: 3
                      ports:
                        - name: http
                          containerPort: 80
                          protocol: TCP
                        - name: https
                          containerPort: 443
                          protocol: TCP
                      volumeMounts:
                        - name: localtime
                          mountPath: /etc/localtime
                          readOnly: true
                      resources:
                        requests:
                          cpu:  100m 
                          memory:  90Mi 
            
                  volumes:
            
                    - name: localtime
                      hostPath:
                        path: /etc/localtime
                        type: File
