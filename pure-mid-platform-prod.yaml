ROSTemplateFormatVersion: '2015-09-01'
Description:
  en: 亲橙智慧
Parameters:
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Description:
      en: When the resource purchase duration is Month, the value of Period ranges from 1 to 9, 12, 24, 36, 48, or 60. <br><b><font color='red'> When ECS instance types are PrePaid valid </b></font>
      zh-cn: 当购买资源时长为Month时，Period取值：1~9 <br><b><font color='red'>当ECS实例类型为PrePaid有效</b></font>
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  ZoneId:
    Type: String
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    Label:
      en: Zone ID
      zh-cn: 可用区
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，<br>您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 10.0.0.0/8
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 10.0.0.0/16
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
  WorkerInstanceType:
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
    Type: String
    Label:
      en: Worker Nodes Types
      zh-cn: Worker节点规格
    Default: ecs.c8i.4xlarge
    AllowedValues:
      - ecs.c8i.4xlarge
      - ecs.u1-c1m2.4xlarge
      - ecs.c8a.4xlarge
      - ecs.c8y.4xlarge
      - ecs.c9i.4xlarge
      - ecs.c6.4xlarge
      - ecs.c6e.4xlarge
  WorkerSystemDiskCategory:
    Type: String
    AssociationProperty: ALIYUN::ECS::Disk::SystemDiskCategory
    AllowedValues:
      - cloud_efficiency
      - cloud_ssd
      - cloud_essd
    AssociationPropertyMetadata:
      LocaleKey: DiskCategory
      InstanceType: ${WorkerInstanceType}
    Label:
      en: Worker System Disk Category
      zh-cn: Worker 系统盘磁盘类型
    Default: cloud_essd
  WorkerSystemDiskSize:
    Type: Number
    Label:
      en: Worker System Disk Size(GB)
      zh-cn: Worker节点系统盘大小(GB)
    MinValue: 1
    Default: 580
  NumOfNodes:
    Type: Number
    Label:
      en: Number of Worker nodes
      zh-cn: Worker节点数量
    MinValue: 1
    Default: 4
  PodCidr:
    Type: String
    Description:
      zh-cn: 请填写有效的私有网段，即以下网段及其子网：10.0.0.0/8，172.16-31.0.0/12-16，192.168.0.0/16<br>不能与 VPC 及 VPC 内已有 Kubernetes 集群使用的网段重复。<font color='blue'><b>创建成功后不能修改</b></font>
      en: 'Please fill in a valid private segment, i.e. the following segments and their subnets: 10.0.0.0/8, 172.16-31.0.0/12-16, 192.168.0.0/16<br> which cannot duplicate the network segments already used by clusters in VPC and VPC Kunetberes. <font color=''blue''><b>Cannot be modified after successful creation</b></font>'
    Label:
      zh-cn: Pod 网络 CIDR
      en: Pod Network CIDR
    AssociationProperty: ALIYUN::CS::ManagedKubernetesCluster::ServiceCidr
    Default: 172.16.0.0/12
  ServiceCidr:
    Type: String
    Description:
      zh-cn: 可选范围：10.0.0.0/16-24，172.16-31.0.0/16-24，192.168.0.0/16-24<br>不能与 VPC 及 VPC 内已有 Kubernetes 集群使用的网段重复。<font color='blue'><b>创建成功后不能修改</b></font>
      en: 'Optional range: 10.0.0.0/16-24, 172.16-31.0.0/16-24, 192.168.0.0/16-24<br> cannot duplicate segments already used by existing Kubernetes clusters in VPC and VPC.<font color=''blue''><b>Cannot be modified after successful creation</b></font>'
    Label:
      zh-cn: Service CIDR
      en: Service CIDR
    AssociationProperty: ALIYUN::CS::ManagedKubernetesCluster::ServiceCidr
    Default: 192.168.0.0/16
  DBInstanceClass:
    Type: String
    Label:
      zh-cn: RDS实例规格
      en: RDB Instance Class
    AssociationProperty: ALIYUN::RDS::Instance::InstanceType
    Default: mysql.n2.xlarge.2c
    AllowedValues:
      - mysql.n2.xlarge.2c
  DBInstanceStorage:
    Label:
      zh-cn: RDS实例存储
      en: Storage
    Type: Number
    Description:
      zh-cn: RDS实例大小范围为20-2000，每5个增量，单位为GB
      en: The size range of RDS instances is 20 - 2000, Incrementing in every 5, unit GB
    MinValue: 20
    MaxValue: 2000
    ConstraintDescription:
      zh-cn: RDS实例大小范围为20-2000，每5个增量，单位为GB
      en: The size range of RDS instances is 20 - 2000, Incrementing in every 5, unit GB
    Default: 500
  DBCategory:
    Label:
      zh-cn: RDS实例系列
      en: RDB Category
    Type: String
    Default: HighAvailability
    AllowedValues:
      - Basic
      - HighAvailability
      - AlwaysOn
      - Finance
    AssociationPropertyMetadata:
      LocaleKey: RDSCategory
  PricingCycle:
    Type: String
    Label:
      en: InfluxDB Pay Period Unit
      zh-cn: InfluxDB购买周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
  Duration:
    Type: Number
    Description:
      en: When the resource purchase duration is Month, the value of Period ranges from 1 to 9, 12, 24, 36, 48, or 60.
      zh-cn: 当购买资源时长为Month时，Period取值：1~3
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
    AssociationProperty: PayPeriod
  InfluxDBType:
    Type: String
    Label:
      en: InfluxDB Instance Type
      zh-cn: InfluxDB实例规格
    Default: influxdata.n1.xlarge
    AllowedValues:
      - influxdata.n1.mxlarge
      - influxdata.n1.xlarge
      - influxdata.n1.2xlarge
      - influxdata.n1.4xlarge
      - influxdata.n1.mxlarge_ha
      - influxdata.n1.xlarge_ha
      - influxdata.n1.2xlarge_ha
      - influxdata.n1.4xlarge_ha
    AssociationProperty: ALIYUN::InfluxDB::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
  InfluxDBStorage:
    Label:
      zh-cn: InfluxDB实例存储
      en: InfluxDB Storage
    Type: Number
    Description:
      zh-cn: InfluxDB实例大小范围为50-32000，每50个增量，单位为GB
      en: The size range of RDS instances is 50-32000, Incrementing in every 50, unit GB
    MinValue: 50
    MaxValue: 32000
    ConstraintDescription:
      zh-cn: InfluxDB实例大小范围为50-32000，每50个增量，单位为GB
      en: The size range of RDS instances is 50-32000, Incrementing in every 50, unit GB
    Default: 2050
  InfluxDBZoneId:
    Type: String
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    Label:
      en: InfluxDB Zone ID
      zh-cn: InfluxDB可用区
  InfluxDBVSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 10.1.0.0/16
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
  CU:
    Label:
      zh-cn: 计算资源单元(CU)
      en: Compute Resource Unit (CU)
    Type: Number
    Description:
      zh-cn: MaxCompute计算资源单元范围为50-2000，每1个增量，单位为CU
      en: The MaxCompute compute resource unit (CU) range is 50 to 2000, with increments of 1.
    MinValue: 50
    MaxValue: 2000
    ConstraintDescription:
      zh-cn: MaxCompute计算资源单元范围为50-2000，每1个增量，单位为CU
      en: The MaxCompute compute resource unit (CU) range is 50 to 2000, with increments of 1.
    Default: 50
Resources:
  RandomApiKey:
    Type: ALIYUN::RandomString
    Properties:
      length: 6
      character_classes:
        - class: lowercase
          min: 1
  Vpc:
    Type: ALIYUN::ECS::VPC
    Properties:
      VpcName:
        Ref: ALIYUN::StackName
      CidrBlock:
        Ref: VpcCidrBlock
  VSwitch:
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: Vpc
      ZoneId:
        Ref: ZoneId
      CidrBlock:
        Ref: VSwitchCidrBlock
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
        - PortRange: '-1/-1'
          Priority: 1
          IpProtocol: all
          DestCidrIp: 0.0.0.0/0
          NicType: intranet
      SecurityGroupIngress:
        - PortRange: '-1/-1'
          Priority: 1
          IpProtocol: all
          SourceCidrIp:
            Ref: PodCidr
          Description: pod网络访问开放
          NicType: intranet
        - PortRange: '-1/-1'
          Priority: 1
          IpProtocol: all
          SourceCidrIp:
            Ref: VpcCidrBlock
          Description: vpc网络访问开放
          NicType: intranet
        - PortRange: '-1/-1'
          Priority: 1
          IpProtocol: icmp
          SourceCidrIp: 0.0.0.0/0
          Description: icmp协议端口放开
          NicType: intranet
  InfluxDBVSwitch:
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: Vpc
      ZoneId:
        Ref: InfluxDBZoneId
      CidrBlock:
        Ref: InfluxDBVSwitchCidrBlock
  RocketMQ:
    Type: ALIYUN::ROCKETMQ5::Instance
    Properties:
      ProductInfo:
        MsgProcessSpec: rmq.s2.2xlarge
      InternetInfo:
        InternetSpec: disable
      SubSeriesCode: cluster_ha
      InstanceName:
        Fn::Sub: ${ALIYUN::StackName}-mq
      SeriesCode: standard
      PaymentType: PayAsYouGo
      VpcInfo:
        VpcId:
          Ref: Vpc
        VSwitchId:
          Ref: VSwitch
  AutoEnableSLS:
    Type: ALIYUN::ROS::AutoEnableService
    Properties:
      ServiceName: SLS
  SlsProject:
    DependsOn: AutoEnableSLS
    Type: ALIYUN::SLS::Project
    Properties:
      Name:
        Fn::Join:
          - '-'
          - - Ref: ALIYUN::StackName
            - sls
  SlsLogStore:
    Type: ALIYUN::SLS::Logstore
    Properties:
      LogstoreName: biz-log-test
      TTL: 90
      AppendMeta: true
      ProjectName:
        Ref: SlsProject
  SlsIndex:
    Type: ALIYUN::SLS::Index
    Properties:
      ProjectName:
        Ref: SlsProject
      FullTextIndex:
        Enable: true
      KeyIndices:
        - Name: content
          Type: text
      LogstoreName:
        Fn::GetAtt:
          - SlsLogStore
          - LogstoreName
  ManagedKubernetesCluster:
    Type: ALIYUN::CS::ManagedKubernetesCluster
    Properties:
      Name:
        Ref: ALIYUN::StackName
      ChargeType:
        Ref: PayType
      Period:
        Ref: PayPeriod
      PeriodUnit:
        Ref: PayPeriodUnit
      VSwitchIds:
        - Ref: VSwitch
      VpcId:
        Ref: Vpc
      WorkerInstanceTypes:
        - Ref: WorkerInstanceType
      ClusterSpec: ack.pro.small
      ContainerCidr:
        Ref: PodCidr
      ServiceCidr:
        Ref: ServiceCidr
      ZoneIds:
        - Ref: ZoneId
      EndpointPublicAccess: true
      IsEnterpriseSecurityGroup: true
      SnatEntry: true
      KubernetesVersion: 1.33.1-aliyun.1
      Runtime:
        Name: containerd
        Version: 1.6.36
      Addons:
        - Name: flannel
          Config: ''
      NumOfNodes: 0
  ClusterNodePool:
    DependsOn: ManagedKubernetesCluster
    Type: ALIYUN::CS::ClusterNodePool
    Properties:
      NodePoolInfo:
        Name: default-pool
      Count:
        Ref: NumOfNodes
      ClusterId:
        Fn::GetAtt:
          - ManagedKubernetesCluster
          - ClusterId
      ScalingGroup:
        InstanceChargeType:
          Ref: PayType
        Period:
          Ref: PayPeriod
        PeriodUnit:
          Ref: PayPeriodUnit
        VSwitchIds:
          - Ref: VSwitch
        InstanceTypes:
          - Ref: WorkerInstanceType
        SystemDiskCategory:
          Ref: WorkerSystemDiskCategory
        SystemDiskSize:
          Ref: WorkerSystemDiskSize
        SystemDiskPerformanceLevel: PL0
        Platform: AliyunLinux3
        LoginPassword: RI!M#jdt902
        ImageId: aliyun_3_x64_20G_alibase_20240819.vhd
  ClusterAddons:
    DependsOn: ClusterNodePool
    Properties:
      Addons:
        - Name: aliyun-acr-credential-helper
          Config: ''
      InstalledIgnore: true
      ClusterId:
        Fn::GetAtt:
          - ManagedKubernetesCluster
          - ClusterId
      WaitUntil:
        - Kind: Deployment
          Name: aliyun-acr-credential-helper
          Namespace: kube-system
          JsonPath: $.status.availableReplicas
          Operator: Equals
          Value: '1'
          Timeout: 120
          ValueType: Json
          FirstMatch: true
    Type: ALIYUN::CS::ClusterAddons
  ClusterApplication:
    DependsOn: ClusterAddons
    Type: ALIYUN::CS::ClusterApplication
    Properties:
      ClusterId:
        Fn::GetAtt:
          - ManagedKubernetesCluster
          - ClusterId
      YamlContent:
        Fn::Sub:
          - |
            ---
            apiVersion: v1
            kind: Namespace
            metadata:
              name: xcampus-cluster
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: xcampus-docker-secret
              namespace: xcampus-cluster
            type: kubernetes.io/dockerconfigjson
            data:
              .dockerconfigjson: ewoJImF1dGhzIjogewoJCSJ4Y2FtcHVzLWRhaWx5LXJlZ2lzdHJ5LmNuLWhhbmd6aG91LmNyLmFsaXl1bmNzLmNvbSI6IHsKCQkJImF1dGgiOiAiYUdWb1pTNWtiM1ZvWldobFFERXdOREk0TURNME16Y3hOVEl5TkRnNmJtcDFkR1JvYURJME9ISmxjM0E9IgoJCX0KCX0KfQ==
            ---
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: xcampus-app-config-cm
              namespace: xcampus-cluster
            data:
              config.json: |
                {
                  "CAMPUS_API_HOST": "-",
                  "CAMPUS_GLOBAL_CONFIG": "{}",
                  "CLUSTER_ID": "local-deploy",
                  "xcampus.db.type": "mysql",
                  "dbseq.drivername": "com.mysql.jdbc.Driver",
                  "dbseq.password": "${Password}",
                  "dbseq.url": "jdbc:mysql://${RdsHost}:3306/?xcampus_global?Unicode=true&characterEncoding=UTF-8&useSSL=false",
                  "dbseq.username": "qcuser",
                  "spring.datasource.druid.driver-class-name": "com.mysql.jdbc.Driver",
                  "spring.datasource.druid.password": "${Password}",
                  "spring.datasource.druid.username": "qcuser",
                  "spring.datasource.driver-class-name": "com.mysql.jdbc.Driver",
                  "xcampus.database.baseurl": "jdbc:mysql://${RdsHost}:3306/",
                  "spring.datasource.type": "com.alibaba.druid.pool.DruidDataSource",
                  "dubbo.config-center.address": "",
                  "dubbo.consumer.check": "false",
                  "dubbo.consumer.version": "1.0.0",
                  "dubbo.metadata-report.address": "",
                  "dubbo.protocol.id": "dubbo",
                  "dubbo.protocol.name": "dubbo",
                  "dubbo.provider.version": "1.0.0",
                  "dubbo.registry.address": "nacos://campus-nacos.xcampus-cluster.svc.cluster.local:8848",
                  "dubbo.registry.registry-mode": "instance",
                  "EDAS_ADDRESS_SERVER_DOMAIN": "campus-nacos.xcampus-cluster.svc.cluster.local:8848",
                  "alibaba.oss.use.https": "false",
                  "alibaba.use.http": "false",
                  "minio.config.innerService": "http://campus-minio.xcampus-cluster.svc.cluster.local:9000/",
                  "minio.config.service": "https://ams.alibaba-inc.com",
                  "minio.config.ak": "root",
                  "minio.config.sk": "jiansheng@alibaba",
                  "alibaba.oss.ak": "",
                  "alibaba.oss.sk": "",
                  "alibaba.oss.use.ak": "true",
                  "alibaba.oss.region": "",
                  "alibaba.oss.endpoint": "",
                  "alibaba.oss.sts.endpoint": "",
                  "alibaba.oss.sts.role": "",
                  "alibaba.oss.internal-endpoint": "",
                  "logging.level.root": "INFO",
                  "mq.ak": "1",
                  "mq.sk": "1",
                  "mq.name.srv.addr": "campus-rocketmq.campus-rocketmq.svc.cluster.local:9876",
                  "nacos.server-addr": "campus-nacos.xcampus-cluster.svc.cluster.local:8848",
                  "nacos.namespace": "campus-nacos-namespace",
                  "NACOS_USER_NAME": "root",
                  "NACOS_PASSWORD": "jiansheng@alibaba",
                  "server.compression.enabled": "true",
                  "server.compression.min-response-size": "2048",
                  "server.compression.mime-types": "application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css",
                  "server.http2.enabled": "true",
                  "spring.redis.password": "jiansheng@alibaba",
                  "spring.redis.sentinel.master": "campus-redis-master",
                  "spring.redis.sentinel.nodes": "campus-redis-sentinel-0.campus-redis-sentinel.xcampus-cluster.svc.cluster.local:26379,campus-redis-sentinel-1.campus-redis-sentinel.xcampus-cluster.svc.cluster.local:26379",
                  "xcampus.env.tag": "nh",
                  "xcampus.tt.enabled": "true",
                  "xcampus.tt.metric-scrape-enabled": "true",
                  "xxl.job.accessToken": "9ecdfeb22b4b87f8d3d27b04c75bc36b",
                  "xxl.job.admin.addresses": "http://campus-xxl-job.xcampus-cluster.svc.cluster.local:9102/xxl-job-admin",
                  "xxl.job.enabled": "true",
                  "xxl.job.executor.logpath": "/mnt/campus/logs/xxl-job",
                  "spring.schedulerx2.enabled": "false",
                  "xcampus.passport.uriScheme": "https"
                }
            ---
            apiVersion: apps/v1
            kind: StatefulSet
            metadata:
              name: campus-nacos
              namespace: xcampus-cluster
            spec:
              serviceName: campus-nacos-headless
              replicas: 2
              template:
                metadata:
                  labels:
                    app: campus-nacos
                  annotations:
                    pod.alpha.kubernetes.io/initialized: "true"
                spec:
                  imagePullSecrets:
                    - name: xcampus-docker-secret
                  containers:
                    - name: nacos
                      command: ["sh", "-c", "docker-startup.sh"]
                      imagePullPolicy: IfNotPresent
                      image: xcampus-daily-registry.cn-hangzhou.cr.aliyuncs.com/local_image/nacos/nacos-server:2.0.4-amd64-v1
                      ports:
                        - containerPort: 8848
                          name: client
                        - containerPort: 9848
                          name: client-rpc
                        - containerPort: 9849
                      env:
                        - name: TZ
                          value: Asia/Shanghai
                        - name: MODE
                          value: cluster
                        - name: MYSQL_SERVICE_DB_NAME
                          value: nacos_config
                        - name: MYSQL_SERVICE_HOST
                          value: ${RdsHost}
                        - name: MYSQL_SERVICE_PORT
                          value: '3306'
                        - name: MYSQL_SERVICE_PASSWORD
                          value: ${Password}
                        - name: MYSQL_SERVICE_USER
                          value: qcuser
                        - name: NACOS_SERVER_PORT
                          value: "8848"
                        - name: NACOS_APPLICATION_PORT
                          value: "8848"
                        - name: NACOS_REPLICAS
                          value: "2"
                        - name: PREFER_HOST_MODE
                          value: "hostname"
                        - name: SPRING_DATASOURCE_PLATFORM
                          value: mysql
                        - name: NACOS_SERVERS
                          value: "campus-nacos-0.campus-nacos-headless.xcampus-cluster.svc.cluster.local:8848 campus-nacos-1.campus-nacos-headless.xcampus-cluster.svc.cluster.local:8848"
              selector:
                matchLabels:
                  app: campus-nacos
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: campus-nacos-headless
              namespace: xcampus-cluster
              labels:
                app: campus-nacos
            spec:
              ports:
                - port: 8848
                  name: "8088"
                  targetPort: 8848
                - name: client-rpc
                  port: 9848
                  protocol: TCP
                  targetPort: 9848
                - name: raft-rpc
                  port: 9849
                  protocol: TCP
                  targetPort: 9849
              selector:
                app: campus-nacos
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: campus-nacos
              namespace: xcampus-cluster
              labels:
                app: campus-nacos
            spec:
              ports:
                - port: 8848
                  name: "8088"
                  targetPort: 8848
                - name: client-rpc
                  port: 9848
                  protocol: TCP
                  targetPort: 9848
                - name: raft-rpc
                  port: 9849
                  protocol: TCP
                  targetPort: 9849
              selector:
                app: campus-nacos
            ---
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: campus-nacos
              namespace: xcampus-cluster
              annotations:
