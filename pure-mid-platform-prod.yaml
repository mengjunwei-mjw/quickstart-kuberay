              annotations:
                component.version: "1.10.4"
                component.revision: "1"
            spec:
              replicas: 2
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxUnavailable: 1
              selector:
                matchLabels:
                  app: ingress-nginx
            
              revisionHistoryLimit: 10
              minReadySeconds: 0
              template:
                metadata:
                  labels:
                    app: ingress-nginx
            
                  annotations:
                    prometheus.io/port: "10254"
                    prometheus.io/scrape: "true"
                    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
                spec:
                  hostNetwork:  false 
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchExpressions:
                            - key: app
                              operator: In
                              values:
                              - ingress-nginx
                          topologyKey: "kubernetes.io/hostname"
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                        - matchExpressions:
                          # virtual nodes have this label
                          - key: type
                            operator: NotIn
                            values:
                            - virtual-kubelet
                      preferredDuringSchedulingIgnoredDuringExecution:
                      - preference:
                          matchExpressions:
                          # autoscaled nodes have this label
                          - key: k8s.aliyun.com
                            operator: NotIn
                            values:
                            - "true"
                        weight: 100
                  dnsPolicy: ClusterFirst
                  nodeSelector:
                    kubernetes.io/os: linux
            
                  tolerations:
            
                  serviceAccountName: ingress-nginx
                  priorityClassName: system-node-critical
                  terminationGracePeriodSeconds: 300
                  initContainers:
                  - name: init-sysctl
                    image: registry-cn-hangzhou-vpc.ack.aliyuncs.com/acs/busybox:v1.29.2
                    command:
                    - /bin/sh
                    - -c
                    - |
                      if [ "$POD_IP" != "$HOST_IP" ]; then
                      mount -o remount rw /proc/sys
                      sysctl -w net.core.somaxconn=65535
                      sysctl -w net.ipv4.ip_local_port_range="1024 65535"
                      sysctl -w kernel.core_uses_pid=0
                      fi
                    securityContext:
                      capabilities:
                          drop:
                          - ALL
                          add:
                          - SYS_ADMIN
                    env:
                      - name: POD_IP
                        valueFrom:
                          fieldRef:
                            fieldPath: status.podIP
                      - name: HOST_IP
                        valueFrom:
                          fieldRef:
                            fieldPath: status.hostIP
                  containers:
                    - name: nginx-ingress-controller
