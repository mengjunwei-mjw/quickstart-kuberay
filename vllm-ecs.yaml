ROSTemplateFormatVersion: '2015-09-01'
Description:
  en: Use vllm deploy llm on ecs.
  zh-cn: 用vllm单机部署大模型
Mappings:
  ModelMap:
    Qwen/QwQ-32B:
      SystemDiskSize: 200
      MaxModelLen: 16384
      VllmVersion: 0.7.2
      GpuMemory: 0.98
    Qwen/Qwen2.5-32B-Instruct:
      SystemDiskSize: 200
      MaxModelLen: 16384
      VllmVersion: 0.7.2
      GpuMemory: 0.98
    Qwen/Qwen3-32B:
      SystemDiskSize: 300
      MaxModelLen: 16384
      VllmVersion: 0.8.5
      GpuMemory: 0.85
    Qwen/Qwen3-235B-A22B:
      SystemDiskSize: 1500
      MaxModelLen: 16384
      VllmVersion: 0.8.5
      GpuMemory: 0.95
    deepseek-ai/DeepSeek-R1-Distill-Llama-70B:
      SystemDiskSize: 300
      MaxModelLen: 16384
      VllmVersion: 0.7.2
      GpuMemory: 0.98
    deepseek-ai/DeepSeek-R1-Distill-Qwen-32B:
      SystemDiskSize: 200
      MaxModelLen: 16384
      VllmVersion: 0.7.2
      GpuMemory: 0.98
    deepseek-ai/DeepSeek-R1-Distill-Qwen-7B:
      SystemDiskSize: 80
      MaxModelLen: 8192
      VllmVersion: 0.7.2
      GpuMemory: 0.98
Conditions:
  PublicAccessConditions:
    Fn::Equals:
      - public
      - Ref: PublicAccessOption
  CreateVpcConditions:
    Fn::Equals:
      - NewVPC
      - Ref: VpcOption
  VllmVersionConditions:
    Fn::Equals:
      - 0.7.2
      - Fn::FindInMap:
          - ModelMap
          - Fn::If:
              - IsQwenModel
              - Ref: ModelNameQwen
              - Ref: ModelNameDeepseek
          - VllmVersion
  IsQwen3:
    Fn::And:
      - Fn::Equals:
          - 'Qwen'
          - Ref: ModelType
      - Fn::Or:
          - Fn::Equals:
              - 'Qwen/Qwen3-32B'
              - Ref: ModelNameQwen
          - Fn::Equals:
              - 'Qwen/Qwen3-235B-A22B'
              - Ref: ModelNameQwen
  IsQwenModel:
    Fn::Equals:
      - 'Qwen'
      - Ref: ModelType
  IsQwQ32B:
    Fn::Equals:
      - 'Qwen/QwQ-32B'
      - Fn::If:
          - IsQwenModel
          - Ref: ModelNameQwen
          - Ref: ModelNameDeepseek
  IsQwen32B:
    Fn::Equals:
      - 'Qwen/Qwen2.5-32B-Instruct'
      - Fn::If:
          - IsQwenModel
          - Ref: ModelNameQwen
          - Ref: ModelNameDeepseek
  IsQwen3-32B:
    Fn::Equals:
      - 'Qwen/Qwen3-32B'
      - Fn::If:
          - IsQwenModel
          - Ref: ModelNameQwen
          - Ref: ModelNameDeepseek
  IsQwen3-235B-A22B:
    Fn::Equals:
      - 'Qwen/Qwen3-235B-A22B'
      - Fn::If:
          - IsQwenModel
          - Ref: ModelNameQwen
          - Ref: ModelNameDeepseek
  IsDeepSeekR170B:
    Fn::Equals:
      - 'deepseek-ai/DeepSeek-R1-Distill-Llama-70B'
      - Fn::If:
          - IsQwenModel
          - Ref: ModelNameQwen
          - Ref: ModelNameDeepseek
  IsDeepSeekR132B:
    Fn::Equals:
      - 'deepseek-ai/DeepSeek-R1-Distill-Qwen-32B'
      - Fn::If:
          - IsQwenModel
          - Ref: ModelNameQwen
          - Ref: ModelNameDeepseek
Parameters:
  PublicAccessOption:
    Type: String
    AllowedValues:
      - public
      - private
    AssociationPropertyMetadata:
      ValueLabelMapping:
        public:
          zh-cn: 开启公网访问
          en: True
        private:
          zh-cn: 不开启公网访问
          en: False
    Label:
      en: Select open or close public network
      zh-cn: 选择是否开启公网访问
    Required: true
    Default: private
  VpcOption:
    Type: String
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    Required: true
    Default: NewVPC
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，<br>您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 192.168.1.0/24
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  ModelType:
    Type: String
    Label:
      en: Model Type
      zh-cn: 模型系列
    Default: "Qwen"
    AllowedValues:
      - Qwen
      - Deepseek
  ModelNameQwen:
    Type: String
    Label:
      en: Model Name
      zh-cn: 模型名称
    Default: "Qwen/Qwen3-235B-A22B"
    AllowedValues:
      - Qwen/Qwen3-235B-A22B
      - Qwen/Qwen3-32B
      - Qwen/QwQ-32B
      - Qwen/Qwen2.5-32B-Instruct
    AssociationPropertyMetadata:
      ValueLabelMapping:
        "Qwen/Qwen3-235B-A22B": Qwen3-235B-A22B
        "Qwen/Qwen3-32B": Qwen3-32B
        "Qwen/QwQ-32B": QwQ-32B
        "Qwen/Qwen2.5-32B-Instruct": Qwen2.5-32B-Instruct
      Visible:
        Condition:
          Fn::Equals:
            - ${ModelType}
            - Qwen
    Description:
      zh-cn: Qwen3-235B-A22B模型需要h20实例规格，部署前请提交工单申请h20购买规格。
      en: Qwen3-235B-A22B models need h20 instance specifications, please submit a ticket to apply for the purchase of h20 specifications.
  ModelNameDeepseek:
    Type: String
    Label:
      en: Model Name
      zh-cn: 模型名称
    Default: "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
    AllowedValues:
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      - deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    AssociationPropertyMetadata:
      ValueLabelMapping:
        "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B": DeepSeek-R1_7B
        "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B": DeepSeek-R1_32B
        "deepseek-ai/DeepSeek-R1-Distill-Llama-70B": DeepSeek-R1_70B
      Visible:
        Condition:
          Fn::Equals:
            - ${ModelType}
            - Deepseek
    Description:
      zh-cn: 部分模型需要的实例规格较大，如当前地域的实例规格不足或无可购买规格，请切换到北京、上海等大地域查看。
      en: Some models require instances with larger specifications, such as insufficient or unavailable specifications in the current region. Please switch to larger regions such as Japan and the United States to view.
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description:
      zh-cn: 如当前地域的实例规格不足或无可购买规格，请切换到北京、上海等大地域查看。
      en: If the instance specifications in the current region are insufficient or no specifications are available for purchase, please switch to larger regions such as Japan and the United States to view.
