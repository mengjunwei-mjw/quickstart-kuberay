Conditions:
  PublicAccessConditions:
    Fn::Or:
      - Fn::Equals:
          - 'Qwen-VL'
          - Ref: ModelType
      - Fn::Equals:
          - true
          - Ref: PublicAccessOption
  CreateVpcConditions:
    Fn::Equals:
      - NewVPC
      - Ref: VpcOption
  VllmVersionConditions:
    Fn::Equals:
      - 0.7.2
      - Fn::FindInMap:
          - ModelMap
          - Ref: ModelName
          - VllmVersion
  IsVLModel:
    Fn::Equals:
      - 'Qwen-VL'
      - Ref: ModelType
  IsQwen3:
    Fn::Equals:
      - 'Qwen3'
      - Ref: ModelType
  IsFP8Model:
    Fn::Equals:
      - 8
      - Fn::FindInMap:
          - ModelMap
          - Ref: ModelName
          - Quantization
Parameters:
  PublicAccessOption:
    Type: Boolean
    Label:
      zh-cn: 支持公网访问
      en: Support Public Access
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - "Qwen-VL"
              - ${ModelType}
    Required: true
  VpcOption:
    Type: String
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    Required: true
    Default: NewVPC
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，<br>您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 192.168.1.0/24
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  ModelType:
    Type: String
    Label:
      en: Model Type
      zh-cn: 模型系列
    Default: "Qwen3"
    AllowedValues:
      - Qwen3
      - Qwen2.5
      - Qwen-VL
      - QwQ
      - Deepseek
      - Cosmos
  ModelName:
    Type: String
    Label:
      en: Model Name
      zh-cn: 模型名称
    Default: "Qwen/Qwen3-8B"
    AllowedValues:
      - Qwen/Qwen3-8B
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-30B-A3B
      - Qwen/Qwen3-32B
      - Qwen/Qwen3-235B-A22B
      - Qwen/Qwen3-30B-A3B-FP8
      - Qwen/Qwen3-32B-FP8
      - Qwen/Qwen3-235B-A22B-FP8
      - Qwen/QwQ-32B
      - Qwen/Qwen2.5-7B-Instruct
      - Qwen/Qwen2.5-32B-Instruct
      - Qwen/Qwen2.5-72B-Instruct
      - Qwen/Qwen2.5-VL-7B-Instruct
      - Qwen/Qwen2.5-VL-32B-Instruct
      - Qwen/Qwen2.5-VL-72B-Instruct
      - deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      - deepseek-ai/DeepSeek-R1-Distill-Llama-70B
      - nv-community/Cosmos-Reason1-7B
    AssociationPropertyMetadata:
      AllowedValues:
        - Condition:
            Fn::Equals:
              - 'Qwen3'
              - ${ModelType}
          Value:
            - Qwen/Qwen3-8B
            - Qwen/Qwen3-14B
            - Qwen/Qwen3-30B-A3B
            - Qwen/Qwen3-32B
            - Qwen/Qwen3-235B-A22B
            - Qwen/Qwen3-30B-A3B-FP8
            - Qwen/Qwen3-32B-FP8
            - Qwen/Qwen3-235B-A22B-FP8
        - Condition:
            Fn::Equals:
              - 'Qwen2.5'
              - ${ModelType}
          Value:
            - Qwen/Qwen2.5-7B-Instruct
            - Qwen/Qwen2.5-32B-Instruct
            - Qwen/Qwen2.5-72B-Instruct
        - Condition:
            Fn::Equals:
              - 'Qwen-VL'
              - ${ModelType}
          Value:
            - Qwen/Qwen2.5-VL-7B-Instruct
            - Qwen/Qwen2.5-VL-32B-Instruct
            - Qwen/Qwen2.5-VL-72B-Instruct
        - Condition:
