            - ecs.gn7e-c16g1.16xlarge
            - ecs.gn7e-c16g1.32xlarge
        - Condition:
            Fn::Or:
              - Fn::Equals:
                  - 'Qwen/Qwen3-30B-A3B-FP8'
                  - ${ModelName}
              - Fn::Equals:
                  - 'Qwen/Qwen3-32B-FP8'
                  - ${ModelName}
          Value:
            - ecs.ebmgn8v.48xlarge
            - ecs.gn8is-2x.8xlarge
            - ecs.gn8is-4x.16xlarge
            - ecs.gn8is-8x.32xlarge
            - ecs.gn8v-4x.8xlarge
            - ecs.gn8v-4x.24xlarge
            - ecs.gn8v-8x.16xlarge
            - ecs.gn8v-8x.48xlarge
        - Condition:
            Fn::Equals:
              - 'Qwen/Qwen3-235B-A22B-FP8'
              - ${ModelName}
          Value:
            - ecs.gn8v-4x.8xlarge
            - ecs.gn8v-4x.24xlarge
            - ecs.gn8v-8x.16xlarge
            - ecs.gn8v-8x.48xlarge
            - ecs.ebmgn8v.48xlarge
        - Condition:
            Fn::Equals:
              - 'Qwen/Qwen3-235B-A22B'
              - ${ModelName}
          Value:
            - ecs.gn8v-8x.16xlarge
            - ecs.gn8v-8x.48xlarge
            - ecs.ebmgn8v.48xlarge
  WhitelistConfirmation:
    Type: String
    Label:
      en: "Whitelist Confirmation"
      zh-cn: "白名单配置确认"
    Default: true
    AssociationProperty: "AlertCheckbox"
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Description:
        zh-cn: |
          <strong>重要前置条件：</strong>
          此模型需要L20或GU8TF卡才可部署。使用此模型前，请确保已申请L20或GU8TF实例规格。如未申请，请联系客服、销售或提交工单加白。
          <a href="https://smartservice.console.aliyun.com/service/create-ticket" target="_blank">提交工单</a>
        en: |
          <strong>Important Preconditions:</strong>
          This model requires an L20 or GU8TF card to deploy. Before using this model, please make sure you have applied for an L20 or GU8TF instance specification. If you have not applied, please contact customer service, sales, or submit a work order to add it.
          <a href="https://smartservice.console.aliyun.com/service/create-ticket" target="_blank">Submit a ticket</a>
      ConfirmText:
        zh-cn: "我已确认完成白名单配置"
        en: "I have confirmed the whitelist configuration"
      Alert: true
      Type: "warning"
      MustChecked: true
      Visible:
        Condition:
          Fn::Or:
            - Fn::Equals:
                - 'Qwen/Qwen3-30B-A3B-FP8'
                - ${ModelName}
            - Fn::Equals:
                - 'Qwen/Qwen3-32B-FP8'
                - ${ModelName}
            - Fn::Equals:
                - 'Qwen/Qwen3-235B-A22B-FP8'
                - ${ModelName}
            - Fn::Equals:
                - 'Qwen/Qwen3-235B-A22B'
                - ${ModelName}
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区ID
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络VPC实例ID
    AssociationProperty: 'ALIYUN::ECS::VPC::VPCId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    Default: ''
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchId:
    Type: String
    Label:
      en: VSwitch ID
      zh-cn: 交换机实例ID
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      VpcId: ${VpcId}
      ZoneId: ${ZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
Resources:
  # 新建vpc
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Ref: ALIYUN::StackName
      CidrBlock:
        Ref: VpcCidrBlock
  # 新建vswitch
  EcsVSwitch:
    Condition: CreateVpcConditions
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: ZoneId
      CidrBlock:
        Ref: VSwitchCidrBlock
  RandomApiKey:
    Type: ALIYUN::RandomString
    Properties:
      length: 29
      character_classes:
        - class: lowercase
          min: 1
        - class: digits
          min: 1
  RandomPassword:
    Type: ALIYUN::RandomString
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
  InstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      InstanceName:
        Fn::Join:
          - '-'
          - - Ref: ALIYUN::StackName
            - 'master'
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      VSwitchId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVSwitch
          - Ref: VSwitchId
      ZoneId:
        Ref: ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId:
        Fn::FindInMap:
          - ModelMap
          - Ref: ModelName
          - ECSImage
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      InstanceType:
        Ref: EcsInstanceType
      NetworkType: vpc
      SystemDiskCategory: cloud_essd
      SystemDiskSize:
        Fn::FindInMap:
          - ModelMap
          - Ref: ModelName
          - SystemDiskSize
      InternetMaxBandwidthOut:
        Fn::If:
          - PublicAccessConditions
          - 5
          - 0
      IoOptimized: optimized
      MaxAmount: 1
  RunInstallCommand:
    DependsOn:
      - InstanceGroup
      - RandomApiKey
    Type: ALIYUN::ECS::RunCommand
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - InstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            docker run -d -t --net=host --gpus all \
            --entrypoint /bin/bash \
            --privileged \
            --ipc=host \
            --name vllm \
            -v /root:/root \
            ${DockerImage} \
            -c "${InstallVLPackage}${InstallVllm}export GLOO_SOCKET_IFNAME=eth0 && 
            export NCCL_SOCKET_IFNAME=eth0 &&
            vllm serve /root/llm-model/${ModelName} \
            --served-model-name ${ModelName} \
            --gpu-memory-utilization ${GpuMemory} \
            --max-model-len ${MaxModelLen} \
            --enable-chunked-prefill \
            --host=0.0.0.0 \
            --port 8000 \
            --trust-remote-code \
            --api-key "${VLLM_API_KEY}" \
            --tensor-parallel-size $(nvidia-smi --query-gpu=index --format=csv,noheader | wc -l | awk '{print $1}')${Qwen3Parameters}${Quantization}${VLParameters}"

            MAX_TIMEOUT=3000
            INTERVAL=10
            MAX_ATTEMPTS=$((MAX_TIMEOUT / INTERVAL))

            for ((i=1; i<=MAX_ATTEMPTS; i++))
            do
                LATEST_LOG=$(docker logs vllm 2>&1 | tail -n 20)
                if echo "$LATEST_LOG" | grep -q "Application startup complete."
                then
                    exit 0
                else
                    sleep $INTERVAL
                fi
            done
          - ModelName:
              Ref: ModelName
            VLLM_API_KEY:
              Fn::Join:
                - '-'
                - - 'sk'
                  - Fn::GetAtt:
                      - RandomApiKey
                      - value
            MaxModelLen:
              Fn::FindInMap:
                - ModelMap
                - Ref: ModelName
                - MaxModelLen
            InstallVllm:
              Fn::If:
                - VllmVersionConditions
                - ''
                - Fn::Sub:
                    - 'pip install --upgrade vllm==${VllmVersion} && '
                    - VllmVersion:
                        Fn::FindInMap:
                          - ModelMap
                          - Ref: ModelName
                          - VllmVersion
            GpuMemory:
              Fn::FindInMap:
                - ModelMap
                - Ref: ModelName
                - GpuMemory
            Qwen3Parameters:
              Fn::If:
                - IsQwen3
                - ' --enable-reasoning --reasoning-parser deepseek_r1'
                - ''
            Quantization:
              Fn::If:
                - IsFP8Model
                - ' --quantization fp8'
                - ''
            DockerImage:
              Fn::FindInMap:
                - ModelMap
                - Ref: ModelName
                - DockerImage
            InstallVLPackage:
              Fn::If:
                - IsVLModel
                - 'pip install transformers==4.51.3 && pip install accelerate && pip install qwen-vl-utils && '
                - ''
            VLParameters:
              Fn::If:
                - IsVLModel
                - ' --dtype bfloat16 --limit-mm-per-prompt image=5,video=5'
                - ''
Outputs:
  模型名称:
    Label:
      zh-ch: 模型名称
      en: Model Name
    Value:
      Ref: ModelName
  ApiKey:
    NoEcho: true
    Label: API Key
    Value:
      Fn::Join:
        - '-'
        - - 'sk'
          - Fn::GetAtt:
              - RandomApiKey
              - value
  Web应用:
    Label:
      zh-ch: Web应用
      en: Web Application
    Value: https://appflow.console.aliyun.com/vendor/cn-hangzhou/llm/chat?serviceInstanceId={{serviceInstanceId}}
  内网地址:
    Label:
      zh-ch: 内网地址
      en: Internal Address
    Value:
      Fn::Sub:
        - 'http://${Endpoint}:8000/v1'
        - Endpoint:
            Fn::Select:
              - '0'
              - Fn::GetAtt:
                  - InstanceGroup
                  - PrivateIps
  公网地址:
    Label:
      zh-ch: 公网地址
      en: Public address
    Value:
      Fn::If:
        - PublicAccessConditions
        - Fn::Sub:
            - 'http://${Endpoint}:8000/v1'
            - Endpoint:
                Fn::Select:
                  - '0'
                  - Fn::GetAtt:
                      - InstanceGroup
                      - PublicIps
        - Fn::Select:
            - '0'
            - Fn::GetAtt:
                - InstanceGroup
                - PublicIps
  InstancePassword:
    NoEcho: 'True'
    Label:
      en: Ecs Instance password
      zh-cn: ECS实例密码
    Description:
      en: Initial instance password
      zh-cn: ECS实例密码
    Value:
      Fn::GetAtt:
        - RandomPassword
        - value
  Api调用示例:
    Label:
      zh-ch: Api调用示例
      en: Api call example
    Description: 通过以下命令发送HTTP请求即可访问推理服务，内网访问需保证在同一VPC下。
    Value:
      Fn::If:
        - IsVLModel
        - Fn::Sub:
            - 'curl -X POST "${ApiServiceIp}/chat/completions" 
                      -H "Content-Type: application/json" 
                      -H "Authorization: Bearer ${API_KEY}"
                      --data ''{ 
                        "stream": true,
                        "model": "${ModelName}",
                           "messages": [
                             { "role": "system", "content": "You are a helpful assistant." },
                             { "role": "user", "content": [
                               { "type": "image_url", "image_url": { "url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png" } },
                               { "type": "text", "text": "What is the text in the illustrate?" }
                             ] }
                           ]
                      }'''
            - ModelName:
                Ref: ModelName
              API_KEY:
                Fn::Join:
                  - '-'
                  - - 'sk'
                    - Fn::GetAtt:
                        - RandomApiKey
                        - value
              ApiServiceIp:
                Fn::If:
                  - PublicAccessConditions
                  - Fn::Sub:
                      - 'http://${Endpoint}:8000/v1'
                      - Endpoint:
                          Fn::Select:
                            - '0'
                            - Fn::GetAtt:
                                - InstanceGroup
                                - PublicIps
                  - Fn::Sub:
                      - 'http://${Endpoint}:8000/v1'
                      - Endpoint:
                          Fn::Select:
                            - '0'
                            - Fn::GetAtt:
                                - InstanceGroup
                                - PrivateIps
        - Fn::Sub:
            - 'curl -X POST "${ApiServiceIp}/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer ${API_KEY}" --data ''{ "stream": true, "model": "${ModelName}",  "messages": [ { "role": "user", "content": "Tell me the recipe for tea" } ] }'''
            - ModelName:
                Ref: ModelName
              API_KEY:
                Fn::Join:
                  - '-'
                  - - 'sk'
                    - Fn::GetAtt:
                        - RandomApiKey
                        - value
              ApiServiceIp:
                Fn::If:
                  - PublicAccessConditions
                  - Fn::Sub:
                      - 'http://${Endpoint}:8000/v1'
                      - Endpoint:
                          Fn::Select:
                            - '0'
                            - Fn::GetAtt:
                                - InstanceGroup
                                - PublicIps
                  - Fn::Sub:
                      - 'http://${Endpoint}:8000/v1'
                      - Endpoint:
                          Fn::Select:
                            - '0'
                            - Fn::GetAtt:
                                - InstanceGroup
                                - PrivateIps
Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - WhitelistConfirmation
        Label:
          zh-cn: 白名单配置
          en: Whitelist Configuration
      - Parameters:
          - ModelType
          - ModelName
          - PayType
          - PayPeriodUnit
          - PayPeriod
          - EcsInstanceType
        Label:
          zh-cn: 资源配置
          en: Resource Configuration
      - Parameters:
          - ZoneId
          - VpcOption
          - VpcId
          - VSwitchId
          - VpcCidrBlock
          - VSwitchCidrBlock
          - PublicAccessOption
        Label:
          zh-cn: 网络配置
          en: Network Configuration