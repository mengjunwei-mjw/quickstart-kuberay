  InstancePassword:
    NoEcho: true
    Type: String
    Description:
      en: Server login password, Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 服务器登录密码,长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    AllowedPattern: '^[a-zA-Z0-9-\(\)\`\~\!\@\#\$\%\^\&\*\_\-\+\=\|\{\}\[\]\:\;\<\>\,\.\?\/]*$'
    Label:
      en: Instance Password
      zh-cn: 实例密码
    ConstraintDescription:
      en: Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    MinLength: 8
    MaxLength: 30
    AssociationProperty: ALIYUN::ECS::Instance::Password
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区ID
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络VPC实例ID
    AssociationProperty: 'ALIYUN::ECS::VPC::VPCId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    Default: ''
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchId:
    Type: String
    Label:
      en: VSwitch ID
      zh-cn: 交换机实例ID
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      VpcId: ${VpcId}
      ZoneId: ${ZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
Resources:
  # 新建vpc
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Ref: ALIYUN::StackName
      CidrBlock:
        Ref: VpcCidrBlock
  # 新建vswitch
  EcsVSwitch:
    Condition: CreateVpcConditions
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: ZoneId
      CidrBlock:
        Ref: VSwitchCidrBlock
  RandomApiKey:
    Type: ALIYUN::RandomString
    Properties:
      length: 29
      character_classes:
        - class: lowercase
          min: 1
        - class: digits
          min: 1
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      SecurityGroupIngress:
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
  InstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      InstanceName:
        Fn::Join:
          - '-'
          - - Ref: ALIYUN::StackName
            - 'master'
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      VSwitchId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVSwitch
          - Ref: VSwitchId
      ZoneId:
        Ref: ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId:
        Fn::If:
          - IsQwen3-32B
          - qwen3_32b
          - Fn::If:
              - IsQwen3-235B-A22B
              - qwen3_235b_a22b
              - Fn::If:
                  - IsQwQ32B
                  - qwq_32b
                  - Fn::If:
                      - IsQwen32B
                      - qwen_2_5_32b
                      - Fn::If:
                          - IsDeepSeekR170B
                          - deepseek_r1_70b
                          - Fn::If:
                              - IsDeepSeekR132B
                              - deepseek_r1_32b
                              - deepseek_r1_7b
      Password:
        Ref: InstancePassword
      InstanceType:
        Ref: EcsInstanceType
      NetworkType: vpc
      SystemDiskCategory: cloud_essd
      SystemDiskSize:
        Fn::FindInMap:
          - ModelMap
          - Fn::If:
              - IsQwenModel
              - Ref: ModelNameQwen
              - Ref: ModelNameDeepseek
          - SystemDiskSize
      InternetMaxBandwidthOut:
        Fn::If:
          - PublicAccessConditions
          - 5
          - 0
      IoOptimized: optimized
      MaxAmount: 1
  RunInstallCommand:
    DependsOn:
      - InstanceGroup
      - RandomApiKey
    Type: ALIYUN::ECS::RunCommand
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - InstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            docker run -d -t --net=host --gpus all \
            --entrypoint /bin/bash \
            --privileged \
            --ipc=host \
            --name vllm \
            -v /root:/root \
            egs-registry.cn-hangzhou.cr.aliyuncs.com/egs/vllm:0.7.2-pytorch2.5.1-cuda12.4-ubuntu22.04 \
            -c "${InstallVllm}export GLOO_SOCKET_IFNAME=eth0 && 
            export NCCL_SOCKET_IFNAME=eth0 &&
            vllm serve /root/llm-model/${ModelName} \
            --served-model-name ${ModelName} \
            --gpu-memory-utilization ${GpuMemory} \
            --max-model-len ${MaxModelLen} \
            --enable-chunked-prefill \
            --host=0.0.0.0 \
            --port 8080 \
            --trust-remote-code \
            --api-key "${VLLM_API_KEY}" \
            --tensor-parallel-size $(nvidia-smi --query-gpu=index --format=csv,noheader | wc -l | awk '{print $1}')${Parameters}"

            MAX_TIMEOUT=3000
            INTERVAL=10
            MAX_ATTEMPTS=$((MAX_TIMEOUT / INTERVAL))

            for ((i=1; i<=MAX_ATTEMPTS; i++))
            do
                LATEST_LOG=$(docker logs vllm 2>&1 | tail -n 20)
                if echo "$LATEST_LOG" | grep -q "Application startup complete."
                then
                    exit 0
                else
                    sleep $INTERVAL
                fi
            done
          - ModelName:
              Fn::If:
                - IsQwenModel
                - Ref: ModelNameQwen
                - Ref: ModelNameDeepseek
            VLLM_API_KEY:
              Fn::Join:
                - '-'
                - - 'sk'
                  - Fn::GetAtt:
                      - RandomApiKey
                      - value
            MaxModelLen:
              Fn::FindInMap:
                - ModelMap
                - Fn::If:
                    - IsQwenModel
                    - Ref: ModelNameQwen
                    - Ref: ModelNameDeepseek
                - MaxModelLen
            InstallVllm:
              Fn::If:
                - VllmVersionConditions
                - ''
                - Fn::Sub:
                    - 'pip install --upgrade vllm==${VllmVersion} && '
                    - VllmVersion:
                        Fn::FindInMap:
                          - ModelMap
                          - Fn::If:
                              - IsQwenModel
                              - Ref: ModelNameQwen
                              - Ref: ModelNameDeepseek
                          - VllmVersion
            GpuMemory:
              Fn::FindInMap:
                - ModelMap
                - Fn::If:
                    - IsQwenModel
                    - Ref: ModelNameQwen
                    - Ref: ModelNameDeepseek
                - GpuMemory
            Parameters:
              Fn::If:
                - IsQwen3
                - ' --enable-reasoning --reasoning-parser deepseek_r1'
                - ''
