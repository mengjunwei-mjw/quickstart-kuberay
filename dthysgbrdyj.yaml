ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: 从镜像仓库部署单机容器应用
  en: Deploy container application from image registry
Parameters:
  ActivityType:
    Type: String
    ReadOnly: true
    Default: normal
    AllowedValues:
      - free_trier_for_ecs
      - normal
    Label:
      en: Type of Instance
      zh-cn: 实例类型
    AssociationPropertyMetadata:
      AutoChangeType: true
      AutoSelectFirst: true
      ValueLabelMapping:
        free_trier_for_ecs:
          zh-cn: 创建试用ECS实例
          en: Free ECS Instance
        normal:
          zh-cn: 创建普通ECS实例
          en: Normal ECS Instance
  Branch:
    Type: String
    Default: ''
  CommitHash:
    Type: String
    Default: ''
  ImagePullPath:
    Type: String
    Default: ''
  AcrUsername:
    Type: String
    Default: ''
  AcrPassword:
    Type: String
    NoEcho: true
    Default: ''
  RepoType:
    Type: String
    Label:
      en: Repository type
      zh-cn: 仓库类型
    AllowedValues:
      - Sample
      - Public
      - Private
    Default: Sample
    AssociationPropertyMetadata:
      ValueLabelMapping:
        Sample:
          zh-cn: 示例
          en: Sample
        Public:
          zh-cn: 公开
          en: Public
        Private:
          zh-cn: 私有
          en: Private
  ArtifactSourceType:
    Type: String
    Default: Dockerfile
    Label:
      en: artifact source type
      zh-cn: 部署类型
    AllowedValues:
      - Dockerfile
      - Buildpacks
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      ForceRadio: true
      ValueLabelMapping:
        Dockerfile: Dockerfile
        Buildpacks: Buildpacks
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - Sample
              - ${RepoType}
  DockerfilePath:
    Type: String
    Label:
      en: Dockerfile Path
      zh-cn: Dockerfile 路径
    Description:
      en: The path of the repository where the Dockerfile is located.
      zh-cn: 指定 Dockerfile 路径，路径应当为基于源仓库的相对路径。
    Default: Dockerfile
    AssociationProperty: ALIYUN::OOS::GitContent::Content
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - ${ArtifactSourceType}
                - Dockerfile
            - Fn::Not:
                Fn::Equals:
                  - Sample
                  - ${RepoType}
  AdvancedOptions:
    Type: Boolean
    Default: false
    Label:
      en: Advanced Options
      zh-cn: 高级选项
    Description:
      en: Advanced options. Such as setting environment variables or specifying image build parameters.
      zh-cn: 高级选项。如设置环境变量或指定构建镜像构建参数
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - Sample
              - ${RepoType}
  BuildArgs:
    Default: []
    Label:
      en: Customized docker build parameters
      zh-cn: Docker镜像构建参数
    Description:
      en: Custom image build parameters that will replace the ARG in the Dockerfile during the image build process.
      zh-cn: 自定义的Docker镜像构建参数。如果你的 Dockerfile 使用了<a href="https://docs.docker.com/build/building/multi-stage/" target='_blank'>多阶段 (multi-stage)</a> 特性 </br>并且需在构建镜像前就设置环境变量，你可以在此处添加构建参数名和参数值 来设置。
    Type: Json
    AssociationProperty: List[Parameters]
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - ${AdvancedOptions}
                - true
            - Fn::Equals:
                - ${ArtifactSourceType}
                - Dockerfile
      Parameters:
        Name:
          Label:
            en: Name
            zh-cn: 镜像构建参数名
          Type: String
        Value:
          Description:
            en: Value
            zn-cn: 镜像构建参数值
          Label:
            en: build parameter value
            zh-cn: 镜像构建参数值
          Type: String
  EnvVar:
    Type: Json
    Label:
      en: Environment variables
      zh-cn: 环境变量
    Description:
      en: Environment variables for the container. Some applications need to set environment variables to start normally, some applications support initialization through environment variables such as setting the initial account and password for the application
      zh-cn: 设置容器的环境变量。有些应用程序需要设置环境变量才能正常启动，有些应用程序支持通过环境变量来初始化比如设置应用的初始账号和密码
    AssociationProperty: List[Parameters]
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ${AdvancedOptions}
            - true
      Parameters:
        Name:
          Type: String
        Value:
          Type: String
    Default: []
  ChargeType:
    Label:
      zh-cn: 付费类型
      en: Pay type
    Type: String
    AllowedValues:
      - PostPaid
      - PrePaid
    Default: PostPaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: ChargeType
  PeriodUnit:
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${ChargeType}
              - PostPaid
    Default: Month
    AllowedValues:
      - Month
    Label:
      zh-cn: 购买资源周期
      en: Pay period unit
    Type: String
  Period:
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${ChargeType}
              - PostPaid
    Default: 1
    Label:
      zh-cn: 购买资源时长
      en: Prepaid resource pay period
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
      - 12
      - 24
      - 36
      - 48
      - 60
    Type: Number
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description:
      zh-cn: 请参考<a href='https://help.aliyun.com/zh/ecs/use-cases/best-practices-for-instance-type-selection' target='_blank'>ECS选型最佳实践</a>
      en: Please refer to <a href='https://www.alibabacloud.com/help/en/ecs/use-cases/best-practices-for-instance-type-selection' target='_blank'>Best practices for selecting ECS instance types</a>
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      InstanceChargeType: ${ChargeType}
      ZoneId: ${ZoneId}
      Constraints:
        InstanceTypeFamily:
          - ecs.u1
          - ecs.e
  SystemDiskCategory:
    Type: String
    AllowedValues:
      - cloud_efficiency
      - cloud_essd
      - cloud_essd_entry
    Label:
      en: System Disk Category
      zh-cn: 系统盘类型
    AssociationPropertyMetadata:
      LocaleKey: DiskCategory
  SystemDiskSize:
    Type: Number
    Description:
      zh-cn: 系统盘大小, 取值范围：[20, 500], 单位：GB。
      en: 'System disk size of each node, range of values: 20-500, units: GB.'
    MinValue: 20
    MaxValue: 500
    Label:
      zh-cn: 系统盘空间(GB)
      en: System Disk Space
  InternetMaxBandwidthOut:
    Type: Number
    Label:
      zh-cn: 公网出带宽最大值(Mbps)
      en: Internet Max Bandwidth Out
    MinValue: 1
    MaxValue: 100
    Description:
      zh-cn: 公网出带宽最大值, 取值范围1-100
      en: 'Internet Max Bandwidth Out,range of values: 1-100'
  InternetChargeType:
    Type: String
    Label:
      zh-cn: 网络付费类型
      en: Internet Charge Type
    AllowedValues:
      - PayByBandwidth
      - PayByTraffic
    AssociationPropertyMetadata:
      LocaleKey: InternetChargeType
  Port:
    Type: Number
    Label:
      en: Application listen port
      zh-cn: 应用监听端口
    Description:
      en: The port application process listens to. Port will be passed to application as environment variable PORT. If application code does not support setting port through environment variable, please set to the default port that application code listens to
      zh-cn: 应用程序进程监听的端口。端口会作为环境变量PORT传递给应用。如果应用代码不支持通过环境变量设置端口，请填写应用代码默认监听的端口
    MaxValue: 65535
    MinValue: 0
    Default: 80
  ZoneId:
    Type: String
    Label:
      zh-cn: 可用区
      en: Zone
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    AssociationPropertyMetadata:
      InstanceChargeType: ${ChargeType}
      SystemDiskCategory: ${SystemDiskCategory}
      InstanceType: ${EcsInstanceType}
      DefaultValueStrategy: first
  VpcOption:
    Type: String
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Required: true
    Default: NewVPC
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络VPC实例ID
    AssociationProperty: ALIYUN::ECS::VPC::VPCId
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    Default: ''
  VSwitchId:
    Type: String
    Label:
      en: VSwitch ID
      zh-cn: 交换机实例ID
    AssociationProperty: ALIYUN::ECS::VSwitch::VSwitchId
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      VpcId: ${VpcId}
      ZoneId: ${ZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    Default: ''
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    Required: true
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段
      en: Must belong to the subnet segment of VPC.
    Default: 192.168.0.0/24
    Required: true
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
Resources:
  RandomPassword:
    Type: ALIYUN::RandomString
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="
  VpcModule:
    Type: MODULE::ACS::ComputeNest::VpcAndVSwitch
    Version: default
    Properties:
      ZoneId:
        Ref: ZoneId
      VpcOption:
        Ref: VpcOption
      VpcId:
        Ref: VpcId
      VSwitchId:
        Ref: VSwitchId
      VSwitchCidrBlock:
        Ref: VSwitchCidrBlock
      VpcCidrBlock:
        Ref: VpcCidrBlock
  EcsSecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      VpcId:
        Fn::GetAtt:
          - VpcModule
          - VpcId
      SecurityGroupIngress:
        - PortRange: 22/22
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
        - SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          PortRange:
            Fn::Sub: ${Port}/${Port}
  EcsInstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      ActivityType:
        Ref: ActivityType
      UpdatePolicy: ForAllInstances
      IoOptimized: optimized
      ZoneId:
        Ref: ZoneId
      VpcId:
        Fn::GetAtt:
          - VpcModule
          - VpcId
      InstanceChargeType:
        Ref: ChargeType
      SecurityGroupId:
        Ref: EcsSecurityGroup
      SystemDiskCategory: cloud_essd
      SystemDiskSize:
        Ref: SystemDiskSize
      ImageId: '{{ resolve:oos:aliyun/services/computenest/images/aliyun_3_2104_docker_26 }}'
      PeriodUnit:
        Ref: PeriodUnit
      VSwitchId:
        Fn::GetAtt:
          - VpcModule
          - VSwitchId
      Period:
        Ref: Period
      InstanceType:
        Ref: EcsInstanceType
      MaxAmount: 1
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      AllocatePublicIP: true
      InternetMaxBandwidthOut:
        Ref: InternetMaxBandwidthOut
      InternetChargeType:
        Ref: InternetChargeType
  RunApplication:
    Type: ALIYUN::ECS::RunCommand
    Properties:
      Sync: true
      CommandContent:
        Fn::Sub: |-
          #!/bin/bash
          if [ "${ImagePullPath}" == "" ]; then
            echo "ImagePullPath is empty, please check."
            exit 1
          fi
          # 判断是否镜像在本地是否已存在
          docker images ${ImagePullPath} | grep ${ImagePullPath}
          if [ $? -gt 0 ]; then
            # 本地不存在镜像，且为私有镜像则进行登录registry
            if [ "${AcrUsername}" != "" ]; then
              echo "login to docker registry"
              server=$(echo ${ImagePullPath} | awk -F/ '{print $1}')
              docker login $server --username=${AcrUsername} --password=${AcrPassword}
            fi
          fi

          # 保存环境变量
          mkdir -p /opt/applicationmanager
          touch /opt/applicationmanager/app.env
          yum install -y jq
          echo '${EnvVar}' | jq -r '.[] | "\(.Name)=\(.Value)"' >> /opt/applicationmanager/app.env

          # 停止已有的服务
          systemctl stop aliyun-applicationmanager

          # 创建系统服务
          cat > /etc/systemd/system/aliyun-applicationmanager.service <<EOF
          [Unit]
          Description=Docker application
          Requires=docker.service
          After=docker.service

          [Service]
          Restart=always
          RemainAfterExit=yes
          WorkingDirectory=/opt/applicationmanager
          ExecStart=docker run --name applicationmanager --rm -p ${Port}:${Port} -e PORT=${Port} --env-file app.env ${ImagePullPath}
          ExecStop=docker stop -t 10 applicationmanager
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable aliyun-applicationmanager
          systemctl start aliyun-applicationmanager
      Type: RunShellScript
      InstanceIds:
        Fn::GetAtt:
          - EcsInstanceGroup
          - InstanceIds
      Timeout: '600'
Outputs:
  endpoint:
    Label:
      zh-cn: 应用访问入口
      en: Application endpoint
    Description:
      zh-cn: 应用访问入口
      en: Application endpoint
    Value:
      Fn::Sub:
        - http://${ServerAddress}:${Port}
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - EcsInstanceGroup
                  - PublicIps
  connectServer:
    Label:
      zh-cn: 远程连接云服务器
      en: Connect to ECS instance
    Description:
      zh-cn: 通过Workbench远程连接云服务器
      en: Connect to ECS instance via Workbench
    Value:
      Fn::Sub:
        - https://ecs-workbench.aliyun.com/?from=ecs&instanceType=ecs&regionId=${RegionId}&instanceId=${InstanceId}
        - InstanceId:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - EcsInstanceGroup
                  - InstanceIds
          RegionId:
            Ref: ALIYUN::Region
  InstancePassword:
    NoEcho: 'True'
    Label:
      en: Ecs Instance password
      zh-cn: ECS实例密码
    Description:
      en: Initial instance password
      zh-cn: ECS实例密码
    Value:
      Fn::GetAtt:
        - RandomPassword
        - value
Mappings: {}
Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - EcsInstanceType
          - SystemDiskCategory
          - SystemDiskSize
          - InternetChargeType
          - InternetMaxBandwidthOut
          - ChargeType
          - PeriodUnit
          - Period
          - Port
        Label: ''
      - Parameters:
          - ArtifactSourceType
          - DockerfilePath
          - AdvancedOptions
          - BuildArgs
          - EnvVar
        Label:
          zh-cn: 环境配置
          en: Environment Configuration
      - Parameters:
          - ZoneId
          - VpcOption
          - VpcId
          - VSwitchId
          - VpcCidrBlock
          - VSwitchCidrBlock
        Label:
          zh-cn: 网络配置
          en: Netowrk configuration
        DefaultExpand: false
      - Parameters:
          - ImagePullPath
          - AcrUsername
          - AcrPassword
          - Branch
          - CommitHash
          - RepoType
        Label: ''
    Hidden:
      - ImagePullPath
      - AcrUsername
      - AcrPassword
      - Branch
      - CommitHash
      - RepoType
      - ActivityType
    QuickDeployConfig:
      PackageFields:
        - Key: EcsInstanceType
        - Key: SystemDiskCategory
          Label:
            zh-cn: 系统盘
            en: System Disk
          Value: '${SystemDiskCategory} / ${SystemDiskSize} GB'
        - Key: InternetChargeType
          Label:
            zh-cn: 公网带宽
            en: Internet Charge Type
          Value: '${InternetChargeType } / ${InternetMaxBandwidthOut} Mbps'
        - Key: ChargeType
          Label:
            zh-cn: 付费类型
            en: Pay Type
          Value: '${ChargeType}'
        - Key: PeriodUnit
          Label:
            zh-cn: 付费时长
            en: Pay Period
          Value: '${Period} ${PeriodUnit}'
      PredefinedParameters:
        - Name: ECS新用户试用套餐
          CommodityId: 10000011871
          Parameters:
            EcsInstanceType: ecs.u1-c1m1.large
            SystemDiskCategory: cloud_essd_entry
            SystemDiskSize: 40
            ChargeType: PostPaid
            InternetChargeType: PayByTraffic
            InternetMaxBandwidthOut: 1
            ActivityType: free_trier_for_ecs
          OrderList:
            - EcsInstanceType
            - SystemDiskCategory
            - SystemDiskSize
            - InternetChargeType
            - InternetMaxBandwidthOut
            - ChargeType
          Type: Normal
          Description: 云服务器ECS免费试用（个人版）,专为ECS新用户打造，提供300元免费额度。
        - Name: 热卖套餐，特价99元/年（限购1台）
          Parameters:
            EcsInstanceType: ecs.e-c1m1.large
            SystemDiskCategory: cloud_essd_entry
            SystemDiskSize: 40
            InternetChargeType: PayByBandwidth
            InternetMaxBandwidthOut: 3
            PeriodUnit: Month
            Period: 12
            ChargeType: PrePaid
          OrderList:
            - EcsInstanceType
            - SystemDiskCategory
            - SystemDiskSize
            - InternetChargeType
            - InternetMaxBandwidthOut
            - PeriodUnit
            - Period
            - ChargeType
          Type: Normal
          Description: 固定带宽不限流量，新老同享，上云首选！
        - Name: 尝鲜套餐，只需0.3元/小时
          Parameters:
            EcsInstanceType: ecs.e-c1m1.large
            SystemDiskCategory: cloud_essd_entry
            SystemDiskSize: 40
            InternetChargeType: PayByTraffic
            InternetMaxBandwidthOut: 3
            ChargeType: PostPaid
          OrderList:
            - EcsInstanceType
            - SystemDiskCategory
            - SystemDiskSize
            - InternetChargeType
            - InternetMaxBandwidthOut
            - ChargeType
          Type: Normal
          Description: 可用300元学生专属代金券抵扣！<a href="https://university.aliyun.com" target="_blank">立即领取</a>
        - Name: 自定义套餐
          Parameters: {}
          OrderList:
            - EcsInstanceType
            - SystemDiskCategory
            - SystemDiskSize
            - InternetChargeType
            - InternetMaxBandwidthOut
            - PeriodUnit
            - Period
            - ChargeType
          Type: Custom
      EnableCustom: true
      CustomFields:
        - Key: Port
      CostRelatedKeys:
        - RegionId
        - Period
      AutomaticZone:
        ZoneIdKey: ZoneId
