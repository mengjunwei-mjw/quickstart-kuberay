ROSTemplateFormatVersion: '2015-09-01'
Description:
  en: 用vllm双机部署大模型
  zh-cn: Use vllm deploy llm on two ecs.
Mappings:
  ModelMap:
    deepseek-ai/DeepSeek-R1:
      SystemDiskSize: 2048
      MaxModelLen: 32768
      SleepTime: 1000
    deepseek-ai/DeepSeek-V3-0324:
      SystemDiskSize: 2048
      MaxModelLen: 32768
      SleepTime: 1000
Conditions:
  PublicAccessConditions:
    Fn::Equals:
      - public
      - Ref: PublicAccessOption
  CreateVpcConditions:
    Fn::Equals:
      - NewVPC
      - Ref: VpcOption
  IsDeepSeekR1671B:
    Fn::Equals:
      - 'deepseek-ai/DeepSeek-R1'
      - Ref: ModelName
  IsDeepSeekV3:
    Fn::Equals:
      - 'deepseek-ai/DeepSeek-V3-0324'
      - Ref: ModelName
Parameters:
  PublicAccessOption:
    Type: String
    AllowedValues:
      - public
      - private
    AssociationPropertyMetadata:
      ValueLabelMapping:
        public:
          zh-cn: 开启公网访问
          en: True
        private:
          zh-cn: 不开启公网访问
          en: False
    Label:
      en: Select open or close public network
      zh-cn: 选择是否开启公网访问
    Required: true
    Default: private
  VpcOption:
    Type: String
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    Required: true
    Default: NewVPC
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，<br>您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 192.168.1.0/24
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  ModelName:
    Type: String
    Label:
      en: Model Name
      zh-cn: 模型名称
    Default: "deepseek-ai/DeepSeek-R1"
    AllowedValues:
      - deepseek-ai/DeepSeek-R1
      - deepseek-ai/DeepSeek-V3-0324
    AssociationPropertyMetadata:
      ValueLabelMapping:
        "deepseek-ai/DeepSeek-R1": DeepSeek-R1_671B
        "deepseek-ai/DeepSeek-V3-0324": DeepSeek-V3
    Description: DeepSeek-R1_671B和DeepSeek-V3模型需要h20实例规格，部署前请提交工单申请h20购买规格。
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description: DeepSeek-R1_671B和DeepSeek-V3模型需要h20实例规格，部署前请提交工单申请h20购买规格。
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      InstanceChargeType: ${PayType}
      AllowedValues:
        - Condition:
            Fn::Equals:
              - '${ModelName}'
              - deepseek-ai/DeepSeek-R1
          Value:
            - ecs.ebmgn8v.48xlarge
        - Condition:
            Fn::Equals:
              - '${ModelName}'
              - deepseek-ai/DeepSeek-V3-0324
          Value:
            - ecs.ebmgn8v.48xlarge
  InstancePassword:
    NoEcho: true
    Type: String
    Description:
      en: Server login password, Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 服务器登录密码,长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    AllowedPattern: '^[a-zA-Z0-9-\(\)\`\~\!\@\#\$\%\^\&\*\_\-\+\=\|\{\}\[\]\:\;\<\>\,\.\?\/]*$'
    Label:
      en: Instance Password
      zh-cn: 实例密码
    ConstraintDescription:
      en: Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    MinLength: 8
    MaxLength: 30
    AssociationProperty: ALIYUN::ECS::Instance::Password
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区ID
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络VPC实例ID
    AssociationProperty: 'ALIYUN::ECS::VPC::VPCId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    Default: ''
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchId:
    Type: String
    Label:
      en: VSwitch ID
      zh-cn: 交换机实例ID
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      VpcId: ${VpcId}
      ZoneId: ${ZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
Resources:
  # 新建vpc
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Ref: ALIYUN::StackName
      CidrBlock:
        Ref: VpcCidrBlock
  # 新建vswitch
  EcsVSwitch:
    Condition: CreateVpcConditions
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: ZoneId
      CidrBlock:
        Ref: VSwitchCidrBlock
  RandomApiKey:
    Type: ALIYUN::RandomString
    Properties:
      length: 29
      character_classes:
        - class: lowercase
          min: 1
        - class: digits
          min: 1
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      SecurityGroupIngress:
        - PortRange: '-1/-1'
          Priority: 1
          IpProtocol: all
          SourceCidrIp:
            Ref: VpcCidrBlock
          Description: vpc网络访问开放
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
  MasterInstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      # 付费类型
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      VSwitchId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVSwitch
          - Ref: VSwitchId
      ZoneId:
        Ref: ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId:
        Fn::If:
          - IsDeepSeekR1671B
          - deepseek_r1_671b
          - deepseek_v3_0324
      Password:
        Ref: InstancePassword
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      SystemDiskSize:
        Fn::FindInMap:
          - ModelMap
          - Ref: ModelName
          - SystemDiskSize
      InternetMaxBandwidthOut:
        Fn::If:
          - PublicAccessConditions
          - 20
          - 0
      IoOptimized: optimized
      MaxAmount: 1
  WorkerInstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      # 付费类型
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      VSwitchId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVSwitch
          - Ref: VSwitchId
      ZoneId:
        Ref: ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId:
        Fn::If:
          - IsDeepSeekR1671B
          - deepseek_r1_671b
          - deepseek_v3_0324
      Password:
        Ref: InstancePassword
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      SystemDiskSize:
        Fn::FindInMap:
          - ModelMap
          - Ref: ModelName
          - SystemDiskSize
      InternetMaxBandwidthOut:
        Fn::If:
          - PublicAccessConditions
          - 20
          - 0
      IoOptimized: optimized
      MaxAmount: 1
  MasterRunInstallCommand:
    DependsOn:
      - MasterInstanceGroup
      - RandomApiKey
    Type: ALIYUN::ECS::RunCommand
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - MasterInstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent: |
            docker run -t -d \
            --name=vllm \
            --ipc=host \
            --cap-add=SYS_PTRACE \
            --network=host \
            --gpus all \
            --privileged \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            -v /root:/root \
            egs-registry.cn-hangzhou.cr.aliyuncs.com/egs/vllm:0.7.2-pytorch2.5.1-cuda12.4-ubuntu22.04
            docker exec -it vllm bash
            pip3 install ray
            ray start --head --dashboard-host 0.0.0.0 --port=6379
  WorkerRunInstallCommand:
    DependsOn:
      - WorkerInstanceGroup
      - MasterRunInstallCommand
    Type: ALIYUN::ECS::RunCommand
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - WorkerInstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            docker run -t -d \
            --name=vllm \
            --ipc=host \
            --cap-add=SYS_PTRACE \
            --network=host \
            --gpus all \
            --privileged \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            -v /root:/root \
            egs-registry.cn-hangzhou.cr.aliyuncs.com/egs/vllm:0.7.2-pytorch2.5.1-cuda12.4-ubuntu22.04
            docker exec -it vllm bash
            pip3 install ray
            ray start --address=${HEAD_NODE_ADDRESS}:6379
            vllm serve /root/llm-model/${ModelName} \
            --served-model-name ${ModelName} \
            --gpu-memory-utilization 0.98 \
            --max-model-len ${MaxModelLen} \
            --enable-chunked-prefill \
            --enforce-eager \
            --host=0.0.0.0 \
            --port 8080 \
            --trust-remote-code \
            --api-key "${VLLM_API_KEY}" \
            --tensor-parallel-size $(nvidia-smi --query-gpu=index --format=csv,noheader | wc -l | awk '{print $1}') \
            --pipeline-parallel-size 2 
            sleep ${SleepTime}
          - ModelName:
              Ref: ModelName
            VLLM_API_KEY:
              Fn::Join:
                - '-'
                - - 'sk'
                  - Fn::GetAtt:
                      - RandomApiKey
                      - value
            MaxModelLen:
              Fn::FindInMap:
                - ModelMap
                - Ref: ModelName
                - MaxModelLen
            SleepTime:
              Fn::FindInMap:
                - ModelMap
                - Ref: ModelName
                - SleepTime
            HEAD_NODE_ADDRESS:
              Fn::Select:
                - '0'
                - Fn::GetAtt:
                    - MasterInstanceGroup
                    - PrivateIps
Outputs:
  Api_Key:
    NoEcho: true
    Label: API Key
    Value:
      Fn::Join:
        - '-'
        - - 'sk'
          - Fn::GetAtt:
              - RandomApiKey
              - value
  内网地址:
    Label: 内网地址
    Value:
      Fn::Sub:
        - 'http://${Endpoint}:8080/v1'
        - Endpoint:
            Fn::Select:
              - '0'
              - Fn::GetAtt:
                  - MasterInstanceGroup
                  - PrivateIps
  公网地址:
    Label: 公网地址
    Value:
      Fn::If:
        - PublicAccessConditions
        - Fn::Sub:
            - 'http://${Endpoint}:8080/v1'
            - Endpoint:
                Fn::Select:
                  - '0'
                  - Fn::GetAtt:
                      - MasterInstanceGroup
                      - PublicIps
        - Fn::Select:
            - '0'
            - Fn::GetAtt:
                - MasterInstanceGroup
                - PublicIps
  Api调用示例:
    NoEcho: true
    Label: Api调用示例
    Description: 通过以下命令发送HTTP请求即可访问推理服务，内网访问需保证在同一VPC下。
    Value:
      Fn::Sub:
        - 'curl -X POST "${ApiServiceIp}/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer ${API_KEY}" --data ''{ "stream": true, "model": "${ModelName}",  "messages": [ { "role": "user", "content": "你是谁？" } ] }'''
        - ModelName:
            Ref: ModelName
          API_KEY:
            Fn::Join:
              - '-'
              - - 'sk'
                - Fn::GetAtt:
                    - RandomApiKey
                    - value
          ApiServiceIp:
            Fn::If:
              - PublicAccessConditions
              - Fn::Sub:
                  - 'http://${Endpoint}:8080/v1'
                  - Endpoint:
                      Fn::Select:
                        - '0'
                        - Fn::GetAtt:
                            - MasterInstanceGroup
                            - PublicIps
              - Fn::Sub:
                  - 'http://${Endpoint}:8080/v1'
                  - Endpoint:
                      Fn::Select:
                        - '0'
                        - Fn::GetAtt:
                            - MasterInstanceGroup
                            - PrivateIps
Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - PayType
          - PayPeriodUnit
          - PayPeriod
        Label:
          default: 付费类型配置
      - Parameters:
          - ModelName
          - EcsInstanceType
          - InstancePassword
        Label:
          default: 资源配置
      - Parameters:
          - ZoneId
          - VpcOption
          - VpcId
          - VSwitchId
          - VpcCidrBlock
          - VSwitchCidrBlock
          - PublicAccessOption
        Label:
          default: 可用区配置